<style>
/* Layout: a reading desk that fills the screen between a slim top bar and a page-position footer; the book sits centered on it. */
:root {
  --desk: #c4cad1; --desk-deep: #aeb5be;
  --chrome: #f4f5f7; --raised: #ffffff; --seg: #e2e5e9;
  --ink-ui: #1d2127; --muted: #5b6570; --line: #d3d8de;
  --accent: #2c6b70;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-book: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #16191d; --desk-deep: #0d0f12;
    --chrome: #1b1e23; --raised: #2a2f36; --seg: #23272d;
    --ink-ui: #e6e8eb; --muted: #98a2ad; --line: #2b3037;
    --accent: #77b8bc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #16191d; --desk-deep: #0d0f12;
  --chrome: #1b1e23; --raised: #2a2f36; --seg: #23272d;
  --ink-ui: #e6e8eb; --muted: #98a2ad; --line: #2b3037;
  --accent: #77b8bc; color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; display: flex; flex-direction: column; overflow: hidden;
  background: var(--desk); color: var(--ink-ui); font-family: var(--font-ui);
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  flex: none; display: flex; align-items: center; gap: 12px;
  padding-block: 8px; padding-left: 16px; padding-right: 16px;
  background: var(--chrome); border-color: var(--line); border-style: solid; border-width: 0;
}
.bar.top { border-bottom-width: 1px; }
.bar.bottom { border-top-width: 1px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; line-height: 1.15; }
.brand strong { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.brand span { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--seg); }
.seg button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font-size: 13px; font-weight: 500; padding: 6px 11px; border-radius: 7px;
}
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink-ui); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.btn {
  border: 1px solid var(--line); background: var(--raised); cursor: pointer;
  font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 8px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--chrome); }

#stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background: radial-gradient(120% 90% at 50% 45%, var(--desk) 55%, var(--desk-deep) 100%); }
#desk { position: absolute; inset: 0; }
#book { position: absolute; }

/* Pages */
.page, .leafback, .stack, .slot { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); }
.page { background: var(--paper); color: var(--ink); overflow: hidden; font-family: var(--font-book); }
.page.left::after, .page.right::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.page.left::after { background: linear-gradient(to left, rgba(0,0,0,var(--spine)) 0, rgba(0,0,0,calc(var(--spine) * .35)) 2.5%, rgba(0,0,0,0) 11%); }
.page.right::after { background: linear-gradient(to right, rgba(0,0,0,var(--spine)) 0, rgba(0,0,0,calc(var(--spine) * .35)) 2.5%, rgba(0,0,0,0) 11%); }
.page.blank > * { visibility: hidden; }
.page.pdf { background: #fbf9f2; }
.page.pdf canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.phead, .pfoot { position: absolute; left: var(--padx); right: var(--padx); text-align: center; color: var(--soft); white-space: nowrap; overflow: hidden; }
.phead { top: calc(var(--padt) * .36); font: 500 calc(var(--fs) * .6)/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; }
.pfoot { bottom: calc(var(--padb) * .34); font: calc(var(--fs) * .74)/1 var(--font-book); font-variant-numeric: oldstyle-nums; }
.pbody { position: absolute; left: var(--padx); top: var(--padt); width: var(--iw); height: var(--ih); overflow: hidden; }
.probe { visibility: hidden; }
.flow {
  position: relative; width: var(--iw); height: var(--ih);
  column-width: var(--iw); column-gap: var(--gap); column-fill: auto;
  font-size: var(--fs); line-height: 1.56; text-align: justify; hyphens: auto; -webkit-hyphens: auto;
  font-variant-numeric: oldstyle-nums;
}
.flow p { margin: 0; text-indent: 1.35em; orphans: 2; widows: 2; }
.flow p.first { text-indent: 0; }
.flow p.first::first-letter { float: left; font-size: 3.2em; line-height: .86; padding: .05em .07em 0 0; font-weight: 500; }
.flow .titleblock { text-align: center; margin: 1.6em 0 2.4em; }
.flow h1 { font-weight: 400; font-size: 1.85em; line-height: 1.15; margin: 0 0 .35em; letter-spacing: .01em; text-wrap: balance; }
.flow .titleblock p { text-indent: 0; font-style: italic; color: var(--soft); text-align: center; }
.flow h2 { text-align: center; font-weight: 400; margin: .4em 0 1.4em; break-after: avoid; }
.flow h2.brk { break-before: column; margin-top: 2.6em; }
.flow h2 small { display: block; font: 500 .62em/1 var(--font-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--soft); margin-bottom: .7em; }
.flow h2 span { font-size: 1.5em; }

.leafback { transform-origin: 0 0; background: var(--paper); overflow: hidden; }
.leafback > .page { transform: none; }
.leafback.mirror > .page { transform: scaleX(-1); }
.leafback.through > .page { opacity: var(--through); background: transparent; }

.stack { pointer-events: none; }

/* Turn rigs: every layer is painted once; a frame of the turn only moves them. */
.rig { position: absolute; left: 0; top: 0; width: var(--bw); height: var(--ph); pointer-events: none; }
.rig.clip { overflow: hidden; }
.slot { overflow: hidden; }
.mask { position: absolute; left: 0; top: 0; width: var(--mb); height: var(--mb); overflow: hidden; transform-origin: 0 0; will-change: transform; }
.inner { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
.lift-shadow { position: absolute; left: 0; top: 0; width: var(--pw); height: var(--ph); box-shadow: 0 0 24px 3px rgba(0,0,0,.5); opacity: 0; will-change: opacity; }
.under-shade, .back-shade { position: absolute; left: 0; top: 0; width: var(--mb); height: 100px; transform-origin: 0 0; will-change: transform, opacity; }
.under-shade { background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.07) 45%, rgba(0,0,0,.2) 82%, rgba(0,0,0,.34) 100%); opacity: 0; }
.back-shade { background: linear-gradient(to bottom, rgba(0,0,0,.26) 0%, rgba(0,0,0,.12) 4%, rgba(0,0,0,.05) 14%, rgba(0,0,0,.02) 40%, rgba(0,0,0,.05) 100%); }
.stacks { position: absolute; inset: 0; }
.stack { background: var(--paper); }

.bar.bottom { gap: 14px; }
.nav {
  flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--raised); display: grid; place-items: center; cursor: pointer;
}
.nav:disabled { opacity: .35; cursor: default; }
.nav svg { width: 18px; height: 18px; }
.where { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.where-text { font-size: 13px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.track { height: 3px; border-radius: 2px; background: var(--seg); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

/* Tune sheet */
#scrim { position: fixed; inset: 0; background: rgba(10,12,15,.28); z-index: 20; }
#tune {
  position: fixed; z-index: 21; right: 0; top: 0; bottom: 0; width: min(380px, 100%);
  background: var(--chrome); border-left: 1px solid var(--line); overflow: auto;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; box-shadow: -12px 0 40px rgba(0,0,0,.18);
}
@media (max-width: 560px) {
  #tune { top: auto; left: 0; width: auto; max-height: 80%; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-block: 14px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .brand span { display: none; }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head strong { font-size: 17px; font-weight: 600; }
.row { display: flex; flex-direction: column; gap: 8px; }
.row-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.row-label output { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .seg { align-self: flex-start; }
.row-hint { font-size: 12px; color: var(--muted); line-height: 1.4; margin: 0; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.sheet-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
#copied { font-size: 12px; color: var(--accent); font-weight: 600; }
#settings-text { display: block; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--seg); padding: 8px 10px; border-radius: 8px; overflow-x: auto; white-space: pre; -webkit-user-select: all; user-select: all; }
</style>

<header class="bar top">
  <div class="brand"><strong>Page Turn Lab</strong><span>FileTube reader prototype</span></div>
  <div class="seg" id="seg-content" role="group" aria-label="Document type"></div>
  <button class="btn" id="tune-open" type="button">Tune</button>
</header>
<main id="stage" aria-label="Book. Drag a page or tap a side to turn.">
  <div id="desk"><div id="book"></div></div>
</main>
<footer class="bar bottom">
  <button class="nav" id="prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="where"><div class="where-text" id="where">Loading the book</div><div class="track"><i id="fill"></i></div></div>
  <button class="nav" id="next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</footer>
<div id="scrim" hidden></div>
<aside id="tune" hidden aria-label="Tune the page turn">
  <div class="sheet-head"><strong>Tune the turn</strong><button class="btn" id="tune-close" type="button">Done</button></div>
  <div id="tune-rows" style="display:flex;flex-direction:column;gap:18px"></div>
  <div class="sheet-foot">
    <button class="btn primary" id="copy" type="button">Copy my settings</button>
    <button class="btn" id="reset" type="button">Reset</button>
    <span id="copied" aria-live="polite"></span>
  </div>
  <code id="settings-text" hidden></code>
  <p class="note">Settings stay in this browser. Send Claude the copied line and the plan starts from your numbers. The book here is plain HTML and the PDF is drawn on a canvas, the same way epub.js and pdf.js hand pages to the real reader.</p>
</aside>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const stage = $('#stage'), desk = $('#desk'), book = $('#book');

const store = {
  get(k, d) { try { const v = localStorage.getItem('ptl.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('ptl.' + k, JSON.stringify(v)); } catch (_) { /* private window */ } },
};
const DEFAULTS = { content: 'book', layout: 'auto', paper: 'book', theme: 'paper', commit: 30, shadow: 60, through: 12, speed: 100 };
const S = Object.assign({}, DEFAULTS, store.get('settings', {}));
const pos = Object.assign({ book: 0, pdf: 0 }, store.get('pos', {}));
let turnedOnce = store.get('turned', false);

// lift: how far the corner rises off the line of the drag; blur: the lifted sheet's shadow; dur: settle time.
const PAPER = { thin: { lift: 1.4, blur: 12, dur: 0.82 }, book: { lift: 1, blur: 18, dur: 1 }, card: { lift: 0.42, blur: 26, dur: 1.28 } };
const THEMES = {
  paper: { paper: '#fbfaf6', ink: '#1f1e1b', soft: '#77726a', edgeA: '#eeebe3', edgeB: '#d6d1c5', spine: 0.15, grain: 0.07, hl: 0.34, mul: 1 },
  sepia: { paper: '#f3e8d0', ink: '#3b2f20', soft: '#86735a', edgeA: '#e5d6b6', edgeB: '#cbb791', spine: 0.17, grain: 0.09, hl: 0.28, mul: 1.05 },
  night: { paper: '#1f2023', ink: '#cdc8bd', soft: '#8a857b', edgeA: '#2b2c30', edgeB: '#141518', spine: 0.45, grain: 0.05, hl: 0.06, mul: 1.9 },
};

// ---------- Book text (Pride and Prejudice, 1813, public domain)
const BOOK_TITLE = 'Pride and Prejudice';
const CHAPTERS = [
  { name: 'Chapter I', paras: [
    'It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.',
    'However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered the rightful property of some one or other of their daughters.',
    '“My dear Mr. Bennet,” said his lady to him one day, “have you heard that Netherfield Park is let at last?”',
    'Mr. Bennet replied that he had not.',
    '“But it is,” returned she; “for Mrs. Long has just been here, and she told me all about it.”',
    'Mr. Bennet made no answer.',
    '“Do you not want to know who has taken it?” cried his wife impatiently.',
    '“_You_ want to tell me, and I have no objection to hearing it.”',
    'This was invitation enough.',
    '“Why, my dear, you must know, Mrs. Long says that Netherfield is taken by a young man of large fortune from the north of England; that he came down on Monday in a chaise and four to see the place, and was so much delighted with it, that he agreed with Mr. Morris immediately; that he is to take possession before Michaelmas, and some of his servants are to be in the house by the end of next week.”',
    '“What is his name?”',
    '“Bingley.”',
    '“Is he married or single?”',
    '“Oh! Single, my dear, to be sure! A single man of large fortune; four or five thousand a year. What a fine thing for our girls!”',
    '“How so? How can it affect them?”',
    '“My dear Mr. Bennet,” replied his wife, “how can you be so tiresome! You must know that I am thinking of his marrying one of them.”',
    '“Is that his design in settling here?”',
    '“Design! Nonsense, how can you talk so! But it is very likely that he _may_ fall in love with one of them, and therefore you must visit him as soon as he comes.”',
    '“I see no occasion for that. You and the girls may go, or you may send them by themselves, which perhaps will be still better, for as you are as handsome as any of them, Mr. Bingley may like you the best of the party.”',
    '“My dear, you flatter me. I certainly _have_ had my share of beauty, but I do not pretend to be anything extraordinary now. When a woman has five grown-up daughters, she ought to give over thinking of her own beauty.”',
    '“In such cases, a woman has not often much beauty to think of.”',
    '“But, my dear, you must indeed go and see Mr. Bingley when he comes into the neighbourhood.”',
    '“It is more than I engage for, I assure you.”',
    '“But consider your daughters. Only think what an establishment it would be for one of them. Sir William and Lady Lucas are determined to go, merely on that account, for in general, you know, they visit no newcomers. Indeed you must go, for it will be impossible for _us_ to visit him if you do not.”',
    '“You are over-scrupulous, surely. I dare say Mr. Bingley will be very glad to see you; and I will send a few lines by you to assure him of my hearty consent to his marrying whichever he chooses of the girls; though I must throw in a good word for my little Lizzy.”',
    '“I desire you will do no such thing. Lizzy is not a bit better than the others; and I am sure she is not half so handsome as Jane, nor half so good-humoured as Lydia. But you are always giving _her_ the preference.”',
    '“They have none of them much to recommend them,” replied he; “they are all silly and ignorant like other girls; but Lizzy has something more of quickness than her sisters.”',
    '“Mr. Bennet, how _can_ you abuse your own children in such a way? You take delight in vexing me. You have no compassion for my poor nerves.”',
    '“You mistake me, my dear. I have a high respect for your nerves. They are my old friends. I have heard you mention them with consideration these last twenty years at least.”',
    '“Ah, you do not know what I suffer.”',
    '“But I hope you will get over it, and live to see many young men of four thousand a year come into the neighbourhood.”',
    '“It will be no use to us, if twenty such should come, since you will not visit them.”',
    '“Depend upon it, my dear, that when there are twenty, I will visit them all.”',
    'Mr. Bennet was so odd a mixture of quick parts, sarcastic humour, reserve, and caprice, that the experience of three-and-twenty years had been insufficient to make his wife understand his character. _Her_ mind was less difficult to develop. She was a woman of mean understanding, little information, and uncertain temper. When she was discontented, she fancied herself nervous. The business of her life was to get her daughters married; its solace was visiting and news.',
  ] },
  { name: 'Chapter II', paras: [
    'Mr. Bennet was among the earliest of those who waited on Mr. Bingley. He had always intended to visit him, though to the last always assuring his wife that he should not go; and till the evening after the visit was paid she had no knowledge of it. It was then disclosed in the following manner. Observing his second daughter employed in trimming a hat, he suddenly addressed her with:',
    '“I hope Mr. Bingley will like it, Lizzy.”',
    '“We are not in a way to know _what_ Mr. Bingley likes,” said her mother resentfully, “since we are not to visit.”',
    '“But you forget, mamma,” said Elizabeth, “that we shall meet him at the assemblies, and that Mrs. Long promised to introduce him.”',
    '“I do not believe Mrs. Long will do any such thing. She has two nieces of her own. She is a selfish, hypocritical woman, and I have no opinion of her.”',
    '“No more have I,” said Mr. Bennet; “and I am glad to find that you do not depend on her serving you.”',
    'Mrs. Bennet deigned not to make any reply, but, unable to contain herself, began scolding one of her daughters.',
    '“Don’t keep coughing so, Kitty, for Heaven’s sake! Have a little compassion on my nerves. You tear them to pieces.”',
    '“Kitty has no discretion in her coughs,” said her father; “she times them ill.”',
    '“I do not cough for my own amusement,” replied Kitty fretfully. “When is your next ball to be, Lizzy?”',
    '“To-morrow fortnight.”',
    '“Aye, so it is,” cried her mother, “and Mrs. Long does not come back till the day before; so it will be impossible for her to introduce him, for she will not know him herself.”',
  ] },
];
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fmt = (s) => esc(s).replace(/_([^_]+)_/g, '<em>$1</em>');
const FLOW_HTML = '<div class="titleblock"><h1>Pride and Prejudice</h1><p>Jane Austen</p></div>' +
  CHAPTERS.map((c, ci) => `<h2 class="ch${ci ? ' brk' : ''}"><small>Chapter</small><span>${ci ? 'II' : 'I'}</span></h2>` +
    c.paras.map((p, pi) => `<p${pi === 0 ? ' class="first"' : ''}>${fmt(p)}</p>`).join('')).join('');

// ---------- PDF pages (The Elements of Style, 1918, public domain), drawn the way pdf.js hands back a canvas
const PDF_W = 612, PDF_H = 792, PDF_SCALE = 2;
const RULES_HEAD = 'ELEMENTARY RULES OF USAGE', COMP_HEAD = 'PRINCIPLES OF COMPOSITION';
const PDF = [
  { title: true },
  { toc: [
    ['I.', 'Introductory', 3, 0], ['II.', 'Elementary Rules of Usage', 4, 0],
    ['1.', 'Form the possessive singular of nouns by adding ’s', 4, 1],
    ['2.', 'In a series of three or more terms, use a comma after each', 5, 1],
    ['3.', 'Enclose parenthetic expressions between commas', 6, 1],
    ['4.', 'Place a comma before a conjunction introducing a clause', 7, 1],
    ['5.', 'Do not join independent clauses by a comma', 7, 1],
    ['III.', 'Elementary Principles of Composition', 8, 0],
    ['10.', 'Use the active voice', 8, 1], ['11.', 'Put statements in positive form', 9, 1],
    ['12.', 'Use definite, specific, concrete language', 9, 1], ['13.', 'Omit needless words', 10, 1],
  ] },
  { head: 'INTRODUCTORY', blocks: [['h', 'I'], ['h', 'INTRODUCTORY'],
    ['p', 'This book is intended for use in English courses in which the practice of composition is combined with the study of literature. It aims to give in brief space the principal requirements of plain English style. It aims to lighten the task of instructor and student by concentrating attention on a few essentials, the rules of usage and principles of composition most commonly violated.'],
    ['p', 'The numbers of the sections may be used as references in correcting manuscript.'],
    ['p', 'The book covers only a small portion of the field of English style, but the experience of its writer has been that once past the essentials, students profit most by individual instruction based on the problems of their own work, and that each instructor has his own body of theory, which he prefers to that offered by any textbook.']] },
  { head: RULES_HEAD, blocks: [['h', 'II'], ['h', 'ELEMENTARY RULES OF USAGE'],
    ['rule', '1.', 'Form the possessive singular of nouns by adding ’s.'],
    ['p', 'Follow this rule whatever the final consonant. Thus write,'],
    ['ex', 'Charles’s friend'], ['ex', 'Burns’s poems'], ['ex', 'the witch’s malice'],
    ['p', 'This is the usage of the United States Government Printing Office and of the Oxford University Press.'],
    ['p', 'Exceptions are the possessives of ancient proper names in -es and -is, the possessive Jesus’, and such forms as for conscience’ sake, for righteousness’ sake.']] },
  { head: RULES_HEAD, blocks: [
    ['rule', '2.', 'In a series of three or more terms with a single conjunction, use a comma after each term except the last.'],
    ['p', 'Thus write,'],
    ['ex', 'red, white, and blue'], ['ex', 'gold, silver, or copper'], ['ex', 'He opened the letter, read it, and made a note of its contents.'],
    ['p', 'This is also the usage of the Government Printing Office and of the Oxford University Press.'],
    ['p', 'In the names of business firms the last comma is omitted, as Brown, Shipley and Company.']] },
  { head: RULES_HEAD, blocks: [
    ['rule', '3.', 'Enclose parenthetic expressions between commas.'],
    ['ex', 'The best way to see a country, unless you are pressed for time, is to travel on foot.'],
    ['p', 'This rule is difficult to apply; it is frequently hard to decide whether a single word, such as however, or a brief phrase, is or is not parenthetic. If the interruption to the flow of the sentence is but slight, the writer may safely omit the commas. But whether the interruption be slight or considerable, he must never omit one comma and leave the other.']] },

// A critically damped spring carries the finger's own speed into the settle, so letting go never jerks.
function settle(to, v0) {
  const t = T;
  t.animTo = to;
  let x = t.p, v = v0, dy = t.dy, last = performance.now();
  const w = 17 * (S.speed / 100) / PAPER[S.paper].dur;
  const step = (now) => {
    if (T !== t) return;
    const dt = clamp((now - last) / 1000, 0, 0.05), h = dt / 4;
    last = now;
    for (let i = 0; i < 4; i++) { v += (-w * w * (x - to) - 2 * w * v) * h; x += v * h; }
    if (x > 1) { x = 1; v = Math.min(v, 0); }
    if (x < 0) { x = 0; v = Math.max(v, 0); }
    dy *= Math.exp(-w * 1.3 * dt);
    if (Math.abs(x - to) < 0.002 && Math.abs(v) < 0.08) { t.raf = 0; t.p = to; t.dy = 0; renderRig(t.rig, to, 0); done(to); return; }
    t.p = x; t.dy = dy;
    renderRig(t.rig, x, dy);
    t.raf = requestAnimationFrame(step);
  };
  t.raf = requestAnimationFrame(step);
}
function finishNow() {
  if (!T || !T.raf) return;
  cancelAnimationFrame(T.raf);
  T.raf = 0;
  const to = T.animTo;
  T.p = to; T.dy = 0;
  renderRig(T.rig, to, 0);
  done(to);
}
function turnAuto(dir) {
  finishNow();
  if (T || !beginTurn(dir, G.H)) return;
  settle(1, 2.4 * (S.speed / 100));
}

// ---------- Input: every pointer move renders straight away (transforms only), no frame of delay
let drag = null;
const zoneDir = (bx) => (bx < G.bookW * 0.34 ? -1 : bx > G.bookW * 0.66 ? 1 : 0);
stage.addEventListener('pointerdown', (e) => {
  if ((e.pointerType === 'mouse' && e.button !== 0) || drag || !rigs) return;
  const r = desk.getBoundingClientRect();
  const d = { id: e.pointerId, x0: e.clientX, y0: e.clientY, bx: e.clientX - r.left - G.bookX, by: e.clientY - r.top - G.bookY, started: false, samples: [] };
  if (T && T.raf) {
    // Catch a page in flight: it stops under the finger and follows it from there.
    cancelAnimationFrame(T.raf); T.raf = 0;
    Object.assign(d, { started: true, caught: true, dir: T.dir, p0: T.p, dy0: T.dy, animTo: T.animTo });
  } else if (T) return;
  drag = d;
  try { stage.setPointerCapture(e.pointerId); } catch (_) { /* fine without capture */ }
});
stage.addEventListener('pointermove', (e) => {
  const d = drag;
  if (!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.started) {
    if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy) * 0.8) { if (Math.hypot(dx, dy) > 14) d.noTap = true; return; }
    d.started = true; d.dir = dx < 0 ? 1 : -1; d.p0 = 0; d.dy0 = 0;
    if (!beginTurn(d.dir, d.by < G.H * 0.42 ? 0 : G.H)) { d.dead = true; return; }
  }
  if (d.dead || !T) return;
  if (d.caught && Math.hypot(dx, dy) > 6) d.moved = true;
  T.p = clamp(d.p0 - d.dir * dx / (2 * G.W), 0, 1);
  T.dy = d.dy0 + dy;
  d.samples.push([e.timeStamp, T.p]);
  if (d.samples.length > 8) d.samples.shift();
  renderRig(T.rig, T.p, T.dy);
}, { passive: true });
function endDrag(e) {
  const d = drag;
  if (!d || e.pointerId !== d.id) return;
  drag = null;
  if (!d.started) { if (!d.noTap && e.type === 'pointerup' && zoneDir(d.bx)) turnAuto(zoneDir(d.bx)); return; }
  if (d.dead || !T) return;
  if (d.caught && !d.moved) {
    // A tap on a page in flight: land that turn, then take the tap as the next one.
    T.p = d.animTo; T.dy = 0; renderRig(T.rig, d.animTo, 0); done(d.animTo);
    if (e.type === 'pointerup' && zoneDir(d.bx)) turnAuto(zoneDir(d.bx));
    return;
  }
  let v = 0;
  const now = d.samples[d.samples.length - 1], old = d.samples.find((s) => now && now[0] - s[0] < 70); // the last moment of the drag says what the finger meant
  if (now && old && now[0] > old[0] && e.timeStamp - now[0] < 80) v = clamp((now[1] - old[1]) / ((now[0] - old[0]) / 1000), -12, 12); // a finger at rest has no speed
  // Turn once the finger has crossed S.commit % of the page width; a flick turns sooner, a pull back cancels.
  const travel = T.p * 2, flick = v * 2; // page widths moved, page widths per second
  const commit = (flick > 1.2 && travel > 0.04) || (flick > -0.4 && travel >= S.commit / 100);
  settle(e.type === 'pointerup' && commit ? 1 : 0, v);
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
$('#prev').addEventListener('click', () => turnAuto(-1));
$('#next').addEventListener('click', () => turnAuto(1));
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('#tune')) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); turnAuto(1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); turnAuto(-1); }
});

function updateFooter() {
  const n = G.count, i = idx(), L = base();
  const span = G.spread ? `pages ${L + 1}–${Math.min(L + 2, n)} of ${n}` : `page ${i + 1} of ${n}`;
  let text = S.content === 'pdf' ? 'The Elements of Style · ' + span : `${CHAPTERS[chapterOf(i)].name} · ${span}`;
  if (!turnedOnce) text = 'Drag a page by its edge, or tap either side';
  $('#where').textContent = text;
  $('#fill').style.width = ((G.spread ? Math.min(L + 2, n) : i + 1) / n * 100) + '%';
  $('#prev').disabled = targetFor(-1) === null;
  $('#next').disabled = targetFor(1) === null;
}

// ---------- Settings
function applyTheme() {
  const th = THEMES[S.theme];
  const v = { '--paper': th.paper, '--ink': th.ink, '--soft': th.soft, '--edge-a': th.edgeA, '--edge-b': th.edgeB, '--spine': th.spine, '--through': S.through / 100 };
  for (const k in v) desk.style.setProperty(k, v[k]);
}
const SEGS = [
  ['paper', 'Paper', [['thin', 'Thin'], ['book', 'Book'], ['card', 'Card']], 'Thin lifts high and settles fast. Card stays flatter and lands slower.'],
  ['theme', 'Page color', [['paper', 'Paper'], ['sepia', 'Sepia'], ['night', 'Night']]],
  ['layout', 'Pages', [['auto', 'Auto'], ['one', 'One'], ['two', 'Two']], 'Auto opens two pages when the screen is wider than tall.'],
];
const SLIDERS = [
  ['commit', 'Turn after', 10, 60, 'How far across the page a drag must go before letting go turns it. A quick flick turns it sooner.'],
  ['shadow', 'Shadow', 0, 100, 'Depth of the crease and the shade on the page beneath.'],
  ['through', 'Show-through', 0, 30, 'How much of the text shows through the back of a single page.'],
  ['speed', 'Settle speed', 50, 200, 'How fast a page finishes once you let go.'],
];
function segButtons(host, key, opts) {
  host.replaceChildren(...opts.map(([val, label]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.dataset.key = key; b.dataset.val = val;
    b.addEventListener('click', () => setSetting(key, val));
    return b;
  }));
}
function buildTune() {
  segButtons($('#seg-content'), 'content', [['book', 'Book'], ['pdf', 'PDF']]);
  const rows = $('#tune-rows');
  for (const [key, label, opts, hint] of SEGS) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div class="row-label"><span>${label}</span></div><div class="seg" role="group" aria-label="${label}"></div>${hint ? `<p class="row-hint">${hint}</p>` : ''}`;
    segButtons(row.querySelector('.seg'), key, opts);
    rows.appendChild(row);
  }
  for (const [key, label, min, max, hint] of SLIDERS) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label class="row-label" for="r-${key}"><span>${label}</span><output id="o-${key}"></output></label><input type="range" id="r-${key}" min="${min}" max="${max}" step="1"><p class="row-hint">${hint}</p>`;
    row.querySelector('input').addEventListener('input', (e) => setSetting(key, +e.target.value));
    rows.appendChild(row);
  }
}
function syncUI() {
  document.querySelectorAll('[data-key]').forEach((b) => b.setAttribute('aria-pressed', String(S[b.dataset.key] === b.dataset.val)));
  for (const [key] of SLIDERS) { $('#r-' + key).value = S[key]; $('#o-' + key).textContent = S[key] + '%'; }
}
function rebuild() {
  if (T && T.raf) cancelAnimationFrame(T.raf);
  T = null; drag = null;
  layout(); buildRigs();
}
function setSetting(key, val) {
  S[key] = val; store.set('settings', S); syncUI();
  if (key === 'content' || key === 'layout') rebuild();
  else if (key === 'theme' || key === 'through') applyTheme();
}
const tune = $('#tune'), scrim = $('#scrim');
const openTune = (open) => { tune.hidden = !open; scrim.hidden = !open; if (open) $('#tune-close').focus(); };
$('#tune-open').addEventListener('click', () => openTune(true));
$('#tune-close').addEventListener('click', () => openTune(false));
scrim.addEventListener('click', () => openTune(false));
$('#reset').addEventListener('click', () => { Object.assign(S, DEFAULTS); store.set('settings', S); syncUI(); applyTheme(); rebuild(); });
$('#copy').addEventListener('click', () => {
  const text = JSON.stringify({ paper: S.paper, commit: S.commit, shadow: S.shadow, through: S.through, speed: S.speed, theme: S.theme });
  const shown = $('#settings-text');
  shown.textContent = text; shown.hidden = false;
  const say = (msg) => { $('#copied').textContent = msg; setTimeout(() => { $('#copied').textContent = ''; }, 2400); };
  try {
    navigator.clipboard.writeText(text).then(() => say('Copied'), () => say('Select the line below to copy it'));
  } catch (_) { say('Select the line below to copy it'); }
});

let resizeTimer = 0, lastSize = '';
new ResizeObserver(() => {
  const size = desk.clientWidth + 'x' + desk.clientHeight;
  if (size === lastSize) return;
  lastSize = size;
  clearTimeout(resizeTimer); resizeTimer = setTimeout(rebuild, 120);
}).observe(desk);

applyTheme(); buildTune(); syncUI();
lastSize = desk.clientWidth + 'x' + desk.clientHeight;
// Build once, after the book font arrives, so the first turn never lands on a rebuild.
const fontsIn = document.fonts && document.fonts.status !== 'loaded' ? document.fonts.ready : null;
if (!fontsIn) rebuild();
else {
  let built = false;
  const boot = () => { if (!built) { built = true; rebuild(); } };
  fontsIn.then(() => { if (built && !T && !drag) rebuild(); else boot(); });
  setTimeout(boot, 1200);
}
})();
</script>
