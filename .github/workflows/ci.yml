name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # v1.123 T2: secret scanning. A pinned gitleaks binary scans the WORKING TREE
  # (dir/--no-git), NOT history: the one historical leak (session-secret,
  # v1.43-v1.123) is known, disclosed, and dead after rotation, so a history
  # scan would be permanently and uselessly red. Config + path allowlists live
  # in .gitleaks.toml (test fixtures carry intentional fake secrets). Its own
  # job (no Node needed) so it runs in parallel and stays independent of the
  # Node matrix below.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v5

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan working tree for secrets
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml --exit-code 1

  # v1.148 T2: the dependency audit gate - fails on any high/critical
  # advisory not covered by docs/audit-exceptions.json (the committed,
  # empty-by-default, reviewed escape hatch; see docs/RELEASING.md).
  # Lockfile-only (`--package-lock-only` inside the script), so the job
  # needs NO `npm ci` - checkout + node + the script. Its own job: it can
  # red overnight from an upstream advisory with zero local changes (the
  # gate working - Dean accepted the cost at intake, 2026-08-18), and a
  # separate job makes that failure self-identifying instead of dressing
  # up as a test failure. Deliberately NOT in the local git hooks: it
  # needs the registry, and network-dependent local gates are the exact
  # class the v1.147.0 refused-tag scar paid for.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dependency audit gate (high/critical fail closed)
        run: npm run audit:check

  # v1.123 T5: lint + token-ratchet + suite across BOTH Node versions the app is
  # verified on. Was a single Node-22 job whose comment claimed "the only Node
  # that matters" while the release ceremony (CLAUDE.md) verifies dual-Node 22 +
  # 24 - the matrix makes CI match the ceremony it contradicted. Node 24's
  # reporter prints `ℹ`, not `#` (memory: an empty grep is not green).
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # v1.62.0: the token ratchet - the design-token census reached zero at
      # v1.61.0 and is ENFORCED there (self-canary first; see
      # docs/CONTRIBUTING.md, MANDATORY styling section).
      - name: Token ratchet
        run: node scripts/css-token-lint.js --enforce

      # v1.47.8: the output is teed to a file and uploaded on failure.
      #
      # WHY: CI failed on `main` (run 338) and PASSED on a commit with a
      # BYTE-IDENTICAL tree (run 339) -- so the suite has an intermittent test.
      # Diagnosing it needed the job log, and `GET .../jobs/:id/logs` requires
      # ADMIN rights, so the one person who could read it was the one person not
      # looking. An artifact is readable by anyone who can see the run, so the
      # next occurrence identifies itself instead of costing a round-trip.
      #
      # `set -o pipefail` is load-bearing: GitHub's default shell is `bash -e`
      # WITHOUT pipefail, so `npm test | tee` would exit with tee's status (0)
      # and a failing suite would report GREEN. That would be strictly worse
      # than the problem this step exists to solve.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test output (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Matrix-scoped name: upload-artifact@v4 errors on a duplicate name, so
          # the two Node legs must not both upload `test-output`.
          name: test-output-node${{ matrix.node-version }}
          path: test-output.txt
          retention-days: 14
