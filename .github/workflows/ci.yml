name: CI

on:
  # A PR runs once, through `pull_request`, on the merge result. There is deliberately NO
  # `push` trigger: a push to main re-ran the same suite on the same tree the PR just tested
  # (ci slim, 2026-10-11). The tag and main (edge) publishes carry their own qualify.
  pull_request:

permissions:
  contents: read

jobs:
  # v1.123 T2: secret scanning. A pinned gitleaks binary scans the WORKING TREE
  # (dir/--no-git), NOT history: the one historical leak (session-secret,
  # v1.43-v1.123) is known, disclosed, and dead after rotation, so a history
  # scan would be permanently and uselessly red. Config + path allowlists live
  # in .gitleaks.toml (test fixtures carry intentional fake secrets). Its own
  # job (no Node needed) so it runs in parallel and stays independent of the
  # Node matrix below.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v5

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan working tree for secrets
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml --exit-code 1

  # v1.148 T2: the dependency audit gate - fails on any high/critical
  # advisory not covered by docs/audit-exceptions.json (the committed,
  # empty-by-default, reviewed escape hatch; see docs/RELEASING.md).
  # Lockfile-only (`--package-lock-only` inside the script), so the job
  # needs NO `npm ci` - checkout + node + the script. Its own job: it can
  # red overnight from an upstream advisory with zero local changes (the
  # gate working - Dean accepted the cost at intake, 2026-08-18), and a
  # separate job makes that failure self-identifying instead of dressing
  # up as a test failure. Deliberately NOT in the local git hooks: it
  # needs the registry, and network-dependent local gates are the exact
  # class the v1.147.0 refused-tag scar paid for.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dependency audit gate (high/critical fail closed)
        run: npm run audit:check

  # Lint + UI ratchet, ONCE (ci slim, 2026-10-11): they do not depend on the Node version or
  # the shard, so they no longer repeat in every suite leg.
  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: ui-exceptions-ratchet diffs docs/ui-exceptions.json against the
      # merge-base with origin/main (a shallow clone has no base and would skip it).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # UI professionalism pass (plan D10): the UI ratchet - twelve rules with
      # canaries against the shrink-only docs/ui-exceptions.json. Its
      # no-raw-values rule replaced the v1.62.0 token ratchet (css-token-lint,
      # retired at plan step 7).
      - name: UI ratchet
        run: npm run lint:ui

  # The suite, on BOTH Node versions the app is verified on, every PR (production is
  # node:22-alpine; 24 is the insurance for the upgrade). Node 22 is split into four shards
  # (`node --test --test-shard=i/4`, by file), Node 24 runs the whole suite as one job
  # (shard 0). Every test file runs on both Nodes per PR. Local verification is Node 22 only.
  # Node 24's reporter prints `ℹ`, not `#` (an empty grep is not green).
  ci:
    name: ci (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: '22', shard: 1, label: '22 shard 1/4' }
          - { node-version: '22', shard: 2, label: '22 shard 2/4' }
          - { node-version: '22', shard: 3, label: '22 shard 3/4' }
          - { node-version: '22', shard: 4, label: '22 shard 4/4' }
          - { node-version: '24', shard: 0, label: '24' }
    steps:
      # fetch-depth 0: see the lint job (the ratchet test lives in the suite too).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # v1.47.8: the output is teed to a file and uploaded on failure.
      #
      # WHY: CI failed on `main` (run 338) and PASSED on a commit with a
      # BYTE-IDENTICAL tree (run 339) -- so the suite has an intermittent test.
      # Diagnosing it needed the job log, and `GET .../jobs/:id/logs` requires
      # ADMIN rights, so the one person who could read it was the one person not
      # looking. An artifact is readable by anyone who can see the run, so the
      # next occurrence identifies itself instead of costing a round-trip.
      #
      # `set -o pipefail` is load-bearing: GitHub's default shell is `bash -e`
      # WITHOUT pipefail, so `npm test | tee` would exit with tee's status (0)
      # and a failing suite would report GREEN. That would be strictly worse
      # than the problem this step exists to solve.
      #
      # Shard 0 is the whole suite (`npm test`); shards 1-4 are the same command with
      # `--test-shard=<i>/4`, so the four together run every file exactly once.
      - name: Test
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          if [ "$SHARD" = "0" ]; then
            npm test 2>&1 | tee test-output.txt
          else
            node --require ./test/helpers/tmp-cleanup.js --test --test-shard="$SHARD/4" test/*/*.test.js 2>&1 | tee test-output.txt
          fi

      - name: Upload test output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Matrix-scoped name: upload-artifact@v4 errors on a duplicate name, so
          # every leg needs its own (node version + shard).
          name: test-output-node${{ matrix.node-version }}-shard${{ matrix.shard }}
          path: test-output.txt
          retention-days: 14
