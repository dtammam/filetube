name: Visual

# UI professionalism pass, plan D10.5 (visual diff) + D10.2 (geometry checks G1-G4).
#
# VISUAL IS A REPORT, NEVER A GATE (Dean, 2026-09-29: ceremony, not friction). `visual` runs
# `run.js --report`: a changed look exits 0, and `visual-comment` posts the side-by-side crops as ONE
# PR comment (updated in place). After a merge to main, `baseline-refresh` commits the new look as
# the baselines: a bot opens a `chore/baselines-<sha>` PR touching ONLY test/visual/baselines/ and
# merges it itself (Dean, 2026-09-30: the refresh had failed on every merge since v1.344.1, so the
# baselines went stale, every PR comment re-reported old drift and the red emails were noise). Only a
# capture that CRASHED fails a leg.
#
# `visual` runs on every pull request (except docs-only ones, below), NOT on the push to main: the
# PR run already diffed the tree main receives. One parallel leg per era x viewport:
# in the pinned Playwright container each leg seeds the
# synthetic fixture (test/visual/seed.js), boots a FRESH read-only server on it
# (test/visual/start-server.sh sets FILETUBE_READONLY=1 and FILETUBE_READ_ONLY_MEDIA=1 and
# turns every background poller off), runs the geometry checks, then captures the scene
# matrix and diffs it against test/visual/baselines/. With no committed
# baselines it FAILS ("no baselines - run the rebaseline job") instead of passing vacuously.
#
# On a push to main, `refresh-source` first looks for the PR run that already shot the merged tree
# (the merge commit's tree equals its PR head's, and that run passed with all 12 legs' shots); the
# refresh reuses those shots, and `rebaseline` re-shoots on main only when there is none.
# `rebaseline` runs from "Run workflow" (workflow_dispatch), on a push to main without a reusable PR
# run (the auto-refresh), or on a push to a `rebaseline/*` branch (GitHub dispatches a workflow only once it exists on the default
# branch, so the FIRST baselines, and any taken before a merge, come from a pushed
# rebaseline/<step> branch at the reviewed sha), in the SAME container, one leg per era x
# viewport, and `rebaseline-merge` joins the 12 into ONE `visual-baselines` artifact. The visual diff skips those branches (they have no baselines yet). On main, `baseline-refresh` commits
# the artifact (test/visual/baselines/ ONLY) to a branch and opens the PR; for a rebaseline/* branch or
# a dispatch, download the artifact into test/visual/baselines/ and commit it as its own commit.
# Baselines are never generated on a dev box (fonts and raster differ outside the container).
#
# The container tag must equal the Playwright version tools/capture/package-lock.json pins
# (test/unit/visual-workflow.test.js binds the two).

# Docs-only changes skip both jobs: the app renders nothing from docs/ or a .md file, so a
# change touching ONLY those paths cannot move a pixel (a change that touches anything else
# runs everything). main requires no status checks, so a skipped run holds nothing up.
on:
  # A PR branch runs once, through `pull_request`; `push` covers main (the merged result).
  # Both on every branch ran each check twice per push and queued the legs for free runners.
  push:
    branches: ['main', 'rebaseline/**'] # a pushed rebaseline/<step> branch is the rebaseline trigger
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One leg per era x viewport, 12 in parallel (it was ONE job, ~50 min; an era alone takes
  # ~23 min, so the viewport split is what brings a run near 10). Each leg diffs only its own
  # baselines (run.js --era/--vp scope the compare); together the 12 cover the whole set. The
  # geometry checks ride the 2021 desktop leg. Every leg uploads its report crops and the shots it
  # took (always); a changed look is reported by `visual-comment`, never a failure.
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        era: ['2021', '2014', '2009', '2005']
        vp: ['phone', 'land', 'desktop']
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
      options: --ipc=host
    env:
      # A FIXED data dir: media ids hash the file path, so the baselines are shot from this one.
      VISUAL_DATA_DIR: /tmp/filetube-visual-data
      TZ: UTC
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the capture tools (Playwright, pinned by tools/capture/package-lock.json)
        run: npm ci --prefix tools/capture

      - name: Playwright matches the container
        run: |
          node -e "const v = require('./tools/capture/node_modules/playwright/package.json').version; if (v !== '1.62.0') { console.error('tools/capture installed Playwright ' + v + ' but the container is v1.62.0-jammy - bump both together'); process.exit(1); } console.log('playwright ' + v)"

      - name: Geometry checks (G1-G4)
        if: matrix.era == '2021' && matrix.vp == 'desktop'
        run: npm run test:geometry

      # --report: a changed look exits 0 (the PR comment shows it); only a crashed capture fails.
      - name: Visual diff (report only)
        if: ${{ !cancelled() }}
        run: node test/visual/run.js --report --era ${{ matrix.era }} --vp ${{ matrix.vp }} --data /tmp/filetube-visual-data --out test-results/visual

      - name: Upload the report and crops
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ matrix.era }}-${{ matrix.vp }}
          path: test-results/visual/report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the run record and server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diag-${{ matrix.era }}-${{ matrix.vp }}
          path: |
            test-results/visual/run-record-*.json
            test-results/visual/server.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the shots this leg took
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-shots-${{ matrix.era }}-${{ matrix.vp }}
          path: test-results/visual/shots/*.png
          if-no-files-found: ignore
          retention-days: 14

  # One PR comment, updated in place (found by its hidden marker). Same-repo PRs only: a fork's
  # token is read-only, and the job pushes crops to the orphan branch `visual-reports` (the ONLY
  # ref it writes) so the raw URLs render in the public repo.
  visual-comment:
    needs: visual
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download the 12 legs' reports
        uses: actions/download-artifact@v4
        with:
          pattern: visual-report-*
          path: reports

      - name: Stage the crops on the visual-reports branch
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" visual-reports >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch visual-reports "$url" stage
          else
            git init --quiet stage
            git -C stage checkout --quiet --orphan visual-reports
            git -C stage remote add origin "$url"
          fi
          # Only this PR's latest run stays on the branch.
          rm -rf "stage/pr-${PR}"
          node scripts/visual-report-comment.js --reports reports --stage stage --pr "$PR" --run "${{ github.run_id }}" --repo "$REPO" --out comment.md | tee out.txt
          if grep -q '^changed=true' out.txt && [ -d "stage/pr-${PR}" ]; then
            git -C stage config user.name 'github-actions[bot]'
            git -C stage config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C stage add -- "pr-${PR}"
            git -C stage commit --quiet -m "visual report for PR ${PR}, run ${{ github.run_id }}"
            ok=0
            for i in 1 2 3; do
              if git -C stage push --quiet origin HEAD:refs/heads/visual-reports; then ok=1; break; fi
              git -C stage pull --quiet --rebase origin visual-reports
            done
            [ "$ok" = 1 ] || { echo "the crops did not reach visual-reports"; exit 1; }
          fi

      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- visual-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md >/dev/null
          fi

  # After a merge to main: can the refresh reuse the shots the PR's own `visual` run took? Only when
  # that run rendered exactly what main now holds: main before the merge is an ancestor of the PR
  # head (the PR run's merge ref then equals the head) and the merge commit's tree equals the head's.
  # The run must have passed and uploaded all 12 legs' shots (a leg that did not capture cleanly
  # uploads none, so a short count means a partial set). Otherwise `run` is empty and `rebaseline`
  # re-shoots. The merge of a baselines PR itself skips it, so a refresh never triggers a refresh.
  refresh-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '/chore/baselines-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Find the PR run that shot this exact tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=""
          if head=$(git rev-parse -q --verify 'HEAD^2'); then
            behind=$(gh api "repos/${REPO}/compare/$(git rev-parse 'HEAD^1')...${head}" --jq '.behind_by')
            if [ "$behind" = 0 ] && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${head}^{tree}")" ]; then
              for id in $(gh run list --repo "$REPO" --workflow visual.yml --event pull_request --commit "$head" --status success --limit 5 --json databaseId --jq '.[].databaseId'); do
                # A run of a same-repo PR only (a fork can open its own PR at the same public sha).
                # Its .pull_requests is empty once the PR merged, so the head repository is the test.
                from=$(gh api "repos/${REPO}/actions/runs/${id}" --jq '.head_repository.full_name')
                if [ "$from" != "$REPO" ]; then echo "PR run ${id}: from ${from}, not this repo"; continue; fi
                n=$(gh api "repos/${REPO}/actions/runs/${id}/artifacts?per_page=100" --jq '[.artifacts[] | select((.name | startswith("visual-shots-")) and (.expired | not))] | length')
                if [ "$n" = 12 ]; then run="$id"; break; fi
                echo "PR run ${id}: ${n} of 12 legs uploaded shots"
              done
            else
              echo "the merged tree is not the PR head's (behind by ${behind}); re-shooting on main"
            fi
          else
            echo "not a merge commit; re-shooting on main"
          fi
          echo "reuse: ${run:-none}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  # The same 12 legs; `rebaseline-merge` joins them into the ONE `visual-baselines` artifact
  # (flat, and only when EVERY leg passed: `rebaseline` succeeded), so the download-and-commit
  # step is unchanged.
  # On a push to main it retakes the set for `baseline-refresh` only when `refresh-source` found no
  # PR run to reuse (it is skipped for the merge of a baselines PR, and so is this).
  rebaseline:
    needs: refresh-source
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rebaseline/')) || (needs.refresh-source.result != 'skipped' && needs.refresh-source.outputs.run == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        era: ['2021', '2014', '2009', '2005']
        vp: ['phone', 'land', 'desktop']
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
      options: --ipc=host
    env:
      VISUAL_DATA_DIR: /tmp/filetube-visual-data
      TZ: UTC
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the capture tools (Playwright, pinned by tools/capture/package-lock.json)
        run: npm ci --prefix tools/capture

      - name: Playwright matches the container
        run: |
          node -e "const v = require('./tools/capture/node_modules/playwright/package.json').version; if (v !== '1.62.0') { console.error('tools/capture installed Playwright ' + v + ' but the container is v1.62.0-jammy - bump both together'); process.exit(1); } console.log('playwright ' + v)"

      # The committed baselines are removed first, so the directory (and the upload) holds
      # ONLY this era's fresh shots, never a stale one from the checkout.
      - name: Capture new baselines (this era)
        run: |
          rm -f test/visual/baselines/*.png
          node test/visual/run.js --update --era ${{ matrix.era }} --vp ${{ matrix.vp }} --data /tmp/filetube-visual-data --out test-results/visual

      - name: Upload this era's baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.era }}-${{ matrix.vp }}
          path: test/visual/baselines/*.png
          if-no-files-found: error
          retention-days: 30

  rebaseline-merge:
    needs: rebaseline
    # Explicit: a skipped `refresh-source` (dispatch, rebaseline/*) would otherwise skip this job
    # through the chain even though `rebaseline` ran. A matrix job is `success` only when every leg
    # passed, so a partial set is still never published.
    if: ${{ !cancelled() && needs.rebaseline.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Join the four eras into one artifact (commit it into test/visual/baselines/ yourself)
        uses: actions/upload-artifact/merge@v4
        with:
          name: visual-baselines
          pattern: visual-baselines-*
          retention-days: 30

  # After a merge to main: if the fresh set (the PR run's shots, or the re-shot set) differs from the
  # committed one, a bot opens a PR with ONLY test/visual/baselines/ changed and merges it (a merge
  # made with the workflow token starts no workflow, so it costs no run). Needs the repo setting
  # Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
  # One refresh at a time: two quick merges must not race on the baselines PR.
  baseline-refresh:
    needs: [refresh-source, rebaseline-merge]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.refresh-source.outputs.run != '' || needs.rebaseline-merge.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: baseline-refresh
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download the PR run's shots (the same tree, already shot)
        if: needs.refresh-source.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: visual-shots-*
          merge-multiple: true
          run-id: ${{ needs.refresh-source.outputs.run }}
          github-token: ${{ github.token }}
          path: fresh-baselines

      - name: Download the fresh baselines (re-shot on main)
        if: needs.refresh-source.outputs.run == ''
        uses: actions/download-artifact@v4
        with:
          name: visual-baselines
          path: fresh-baselines

      - name: Open a PR if the baselines changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n=$(find fresh-baselines -name '*.png' | wc -l)
          if [ "$n" -lt 1 ]; then echo "no fresh baselines downloaded"; exit 1; fi
          rm -f test/visual/baselines/*.png
          cp fresh-baselines/*.png test/visual/baselines/
          if [ -z "$(git status --porcelain -- test/visual/baselines)" ]; then
            echo "baselines unchanged"
            exit 0
          fi
          branch="chore/baselines-$(git rev-parse --short HEAD)"
          git checkout -b "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- test/visual/baselines
          if git diff --cached --name-only | grep -qv '^test/visual/baselines/'; then echo "a non-baseline path is staged"; exit 1; fi
          git commit --quiet -m "chore(visual): refresh baselines after $(git rev-parse --short HEAD)"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${branch}"
          {
            echo "The pages look different after the last merge to main. Only test/visual/baselines/ changed; the crops are in the PR comment of the change that caused it. The bot merges this PR itself."
            echo
            echo '```'
            git diff --stat=200 HEAD~1 HEAD -- test/visual/baselines | head -n 100
            echo '```'
          } > body.md
          for old in $(gh pr list --repo "$REPO" --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("chore/baselines-")) | .number'); do
            gh pr close "$old" --repo "$REPO" --delete-branch --comment "Superseded by ${branch}."
          done
          gh pr create --repo "$REPO" --base main --head "$branch" --title "chore(visual): refresh baselines" --body-file body.md
          # Baselines only (checked above), so it merges itself: the look was reviewed in the PR
          # comment of the change that caused it. GitHub deletes the merged branch.
          gh pr merge "$branch" --repo "$REPO" --merge --match-head-commit "$(git rev-parse HEAD)"
