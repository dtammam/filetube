name: Visual

# UI professionalism pass, plan D10.5 (visual diff) + D10.2 (geometry checks G1-G4).
#
# `visual` runs on every push and PR (except docs-only ones, below), one parallel leg per era:
# in the pinned Playwright container each leg seeds the
# synthetic fixture (test/visual/seed.js), boots a FRESH read-only server on it
# (test/visual/start-server.sh sets FILETUBE_READONLY=1 and FILETUBE_READ_ONLY_MEDIA=1 and
# turns every background poller off), runs the geometry checks, then captures the scene
# matrix and diffs it against test/visual/baselines/ at 0 changed pixels. With no committed
# baselines it FAILS ("no baselines - run the rebaseline job") instead of passing vacuously.
#
# `rebaseline` runs only from "Run workflow" (workflow_dispatch), or on a push to a
# `rebaseline/*` branch (GitHub dispatches a workflow only once it exists on the default
# branch, so the FIRST baselines, and any taken before a merge, come from a pushed
# rebaseline/<step> branch at the reviewed sha), in the SAME container, one leg per era, and
# `rebaseline-merge` joins the four eras into ONE `visual-baselines` artifact. The visual diff skips those branches (they have no baselines yet). Committing them is a human/Architect step: download
# the artifact into test/visual/baselines/ and commit it as its own commit, named for the step.
# Baselines are never generated on a dev box (fonts and raster differ outside the container).
#
# The container tag must equal the Playwright version tools/capture/package-lock.json pins
# (test/unit/visual-workflow.test.js binds the two).

# Docs-only changes skip both jobs: the app renders nothing from docs/ or a .md file, so a
# change touching ONLY those paths cannot move a pixel (a change that touches anything else
# runs everything). main requires no status checks, so a skipped run holds nothing up.
on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per era, in parallel (the four eras used to run two at a time in ONE job: ~50
  # min). Each job diffs only its era's baselines (run.js --era scopes the compare); together
  # the four cover the whole set. The geometry checks ride the 2021 job.
  visual:
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/rebaseline/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        era: ['2021', '2014', '2009', '2005']
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
      options: --ipc=host
    env:
      # A FIXED data dir: media ids hash the file path, so the baselines are shot from this one.
      VISUAL_DATA_DIR: /tmp/filetube-visual-data
      TZ: UTC
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the capture tools (Playwright, pinned by tools/capture/package-lock.json)
        run: npm ci --prefix tools/capture

      - name: Playwright matches the container
        run: |
          node -e "const v = require('./tools/capture/node_modules/playwright/package.json').version; if (v !== '1.62.0') { console.error('tools/capture installed Playwright ' + v + ' but the container is v1.62.0-jammy - bump both together'); process.exit(1); } console.log('playwright ' + v)"

      - name: Geometry checks (G1-G4)
        if: matrix.era == '2021'
        run: npm run test:geometry

      - name: Visual diff (0 changed pixels)
        if: ${{ !cancelled() }}
        run: node test/visual/run.js --era ${{ matrix.era }} --data /tmp/filetube-visual-data --out test-results/visual

      - name: Upload the report and crops (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ matrix.era }}
          path: |
            test-results/visual/report/
            test-results/visual/run-record-*.json
            test-results/visual/server.log
          if-no-files-found: ignore
          retention-days: 14

  # One job per era too; `rebaseline-merge` joins the four uploads into the ONE
  # `visual-baselines` artifact, so the download-and-commit step is unchanged.
  rebaseline:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rebaseline/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        era: ['2021', '2014', '2009', '2005']
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
      options: --ipc=host
    env:
      VISUAL_DATA_DIR: /tmp/filetube-visual-data
      TZ: UTC
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install the capture tools (Playwright, pinned by tools/capture/package-lock.json)
        run: npm ci --prefix tools/capture

      - name: Playwright matches the container
        run: |
          node -e "const v = require('./tools/capture/node_modules/playwright/package.json').version; if (v !== '1.62.0') { console.error('tools/capture installed Playwright ' + v + ' but the container is v1.62.0-jammy - bump both together'); process.exit(1); } console.log('playwright ' + v)"

      # The committed baselines are removed first, so the directory (and the upload) holds
      # ONLY this era's fresh shots, never a stale one from the checkout.
      - name: Capture new baselines (this era)
        run: |
          rm -f test/visual/baselines/*.png
          node test/visual/run.js --update --era ${{ matrix.era }} --data /tmp/filetube-visual-data --out test-results/visual

      - name: Upload this era's baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.era }}
          path: test/visual/baselines/*.png
          if-no-files-found: error
          retention-days: 30

  rebaseline-merge:
    needs: rebaseline
    runs-on: ubuntu-latest
    steps:
      - name: Join the four eras into one artifact (commit it into test/visual/baselines/ yourself)
        uses: actions/upload-artifact/merge@v4
        with:
          name: visual-baselines
          pattern: visual-baselines-*
          retention-days: 30
