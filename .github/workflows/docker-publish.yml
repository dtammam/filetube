name: Publish Docker Image

# Image tagging strategy (Docker image hygiene):
#   - Push to main            -> `edge` + `sha-<short>`  (bleeding edge, for testing)
#   - Push a version tag v*.* -> `X.Y.Z`, `X.Y`, `X`, `latest`  (a real release)
#
# So `latest` tracks the newest RELEASE (not every commit), users can pin to any
# `X.Y.Z` / `X.Y` / `X`, and Watchtower can follow `latest` (releases) or `edge`
# (main). Cut a release by pushing a tag or publishing a GitHub Release — see
# docs/RELEASING.md.
on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  # v1.148 T4: the DRY-RUN lever. A manual dispatch runs the ENTIRE
  # pipeline - qualify, secret scan, build, smoke - but every push-side
  # step is skipped (they are gated on `github.event_name == 'push'`).
  # This is how the pipeline itself gets validated in CI after a workflow
  # change, BEFORE the next real tag (the workflows cannot execute on the
  # dev box; docs/RELEASING.md makes the post-merge dry-run a required
  # step of any wave that edits this file).
  workflow_dispatch:

# v1.129 C6: serialize publishes so an OLDER slow run can never finish last and
# overwrite a newer `edge`/`latest` with stale bytes. One lane for all TAG
# publishes (every tag push rewrites `latest`, so tag runs must be ordered) and
# one for branch pushes (`edge`). cancel-in-progress:false protects the RUNNING
# release build - but GitHub holds at most ONE pending run per group, so in a
# rapid tag chain (v1.130.0 running, .1 pending, .2 pushed) the MIDDLE tag's
# run is cancelled and its versioned image never publishes (`latest` still ends
# correct). Accepted trade (gate W3): the stale-`latest` overwrite this
# prevents is worse; RELEASING.md tells the operator to re-run a cancelled
# publish after a hotfix chain.
concurrency:
  group: docker-publish-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  # v1.123 T5: publish is GATED on qualification of the EXACT ref being
  # published. Before this, docker-publish fired on any push to main / any v* tag
  # with ZERO dependency on CI - a red suite still shipped `latest`. `qualify`
  # re-runs the full lint + token-ratchet + dual-Node suite on this ref, and a
  # secret scan (a TAG push does NOT trigger ci.yml, so the released tree would
  # otherwise never be scanned); `publish` `needs` it, so a red qualify blocks
  # the push. This is intentionally self-contained (not a cross-workflow
  # dependency) so the gate travels with the artifact.
  qualify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Token ratchet
        run: node scripts/css-token-lint.js --enforce
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

  # v1.148 gate round 1 (QA W2): the dependency audit gate mirrored onto the
  # RELEASE path, exactly the way qualify/secret-scan were mirrored in
  # v1.123 - a tag push does not trigger ci.yml, so without this a high
  # advisory publishing between the last branch push and the tag would ship
  # inside the release image with the gate never having seen it. The
  # exceptions file (docs/audit-exceptions.json) remains the emergency
  # escape hatch for an outage-day hotfix blocked by an unrelated advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dependency audit gate (high/critical fail closed)
        run: npm run audit:check

  # A pinned secret scan of the ref being published (mirrors ci.yml's job; runs
  # here too because tag pushes skip ci.yml). Publish blocks on this as well.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v5
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan working tree for secrets
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml --exit-code 1

  publish:
    needs: [qualify, secret-scan, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # v1.129 C6: a release image's identity is the TAG, but the app reports
      # package.json's version - if the ceremony ever tags without bumping (or
      # bumps without tagging), the published X.Y.Z image would self-report a
      # different version forever. Refuse the mismatch at the gate.
      - name: Assert tag matches package.json version
        if: github.ref_type == 'tag'
        # ref_name routed via env, never interpolated into the script body
        # (gate S4 hygiene: the v*.*.* glob is not a shell-safety filter).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$REF_NAME" ]; then
            echo "::error::tag ${REF_NAME} != package.json ${PKG} - refusing to publish a mismatched artifact"
            exit 1
          fi
          echo "tag ${REF_NAME} == package.json ${PKG}"

      # v1.148 T4 (release integrity): build ONCE, smoke-test THAT image,
      # push THAT SAME local image to every tag. The pre-wave shape built
      # and pushed in one step - the shipped artifact was never the tested
      # artifact (the qualify job tests SOURCE, not the image; tech-debt
      # #154(d), closed by this design). QEMU setup dropped: the pipeline
      # is deliberately single-arch amd64 (intake decision 6) because
      # build-once/load/run/push depends on the runner executing the image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: deantammam/filetube
          # flavor latest=auto (default): a semver tag also updates `latest`.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build image (load only - nothing is pushed before the smoke)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: filetube-candidate:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The smoke contract is MEASURED, not guessed (dev box, real server,
      # clean temp DATA_DIR, 2026-08-18): a fresh install answers
      # GET /login -> 302 -> /welcome -> 200, and an unauthenticated API
      # call answers 401 (the auth gate alive). The container runs against
      # a fresh anonymous volume (the Dockerfile declares /app/data), so
      # every smoke is a first-run. Any failure dumps the container logs
      # and reds the job - which BLOCKS the push: nothing untested ships.
      - name: Smoke-test the built image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3000:3000 filetube-candidate:local
          fail() {
            echo "::error::smoke failed: $1"
            echo '--- container logs ---'
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          }
          code=000
          for i in $(seq 1 45); do
            code=$(curl -sL --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || echo 000)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || fail "GET /login (following redirects) never reached 200 (last: $code)"
          api=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/stats || echo 000)
          [ "$api" = "401" ] || fail "unauthenticated GET /api/stats returned $api, expected 401 (auth gate)"
          echo "smoke OK: /login -> 200 (via /welcome), /api/stats unauth -> 401"
          docker rm -f smoke

      # Push-side steps: skipped entirely on a workflow_dispatch dry-run.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Promote BY IDENTITY: `docker tag` + `docker push` of the exact
      # local image the smoke just ran - no second build exists to drift.
      # The image id + pushed repo digests land in the step summary so
      # every release run records what shipped.
      - name: Promote the smoked image to every tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [ -n "$TAGS" ] || { echo "::error::metadata produced no tags for a push event - refusing a silent no-op publish"; exit 1; }
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker tag filetube-candidate:local "$t"
            docker push "$t"
          done <<< "$TAGS"
          {
            echo '### Published (the smoked image, promoted by identity)'
            echo "- image id: $(docker inspect --format '{{.Id}}' filetube-candidate:local)"
            echo "- repo digests: $(docker inspect --format '{{join .RepoDigests ", "}}' filetube-candidate:local)"
            echo "- tags:"
            while IFS= read -r t; do [ -n "$t" ] && echo "  - $t"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
