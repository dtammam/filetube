name: Publish Docker Image

# Image tagging strategy (Docker image hygiene):
#   - Push to main            -> `edge` + `sha-<short>`  (bleeding edge, for testing)
#   - Push a version tag v*.* -> `X.Y.Z`, `X.Y`, `X`, `latest`  (a real release)
#
# So `latest` tracks the newest RELEASE (not every commit), users can pin to any
# `X.Y.Z` / `X.Y` / `X`, and Watchtower can follow `latest` (releases) or `edge`
# (main). Cut a release by pushing a tag or publishing a GitHub Release — see
# docs/RELEASING.md.
on:
  push:
    branches: ['main']
    tags: ['v*.*.*']

# v1.129 C6: serialize publishes so an OLDER slow run can never finish last and
# overwrite a newer `edge`/`latest` with stale bytes. One lane for all TAG
# publishes (every tag push rewrites `latest`, so tag runs must be ordered) and
# one for branch pushes (`edge`). Queue, never cancel - a release build in
# flight is never killed by the next one; it just goes first.
concurrency:
  group: docker-publish-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  # v1.123 T5: publish is GATED on qualification of the EXACT ref being
  # published. Before this, docker-publish fired on any push to main / any v* tag
  # with ZERO dependency on CI - a red suite still shipped `latest`. `qualify`
  # re-runs the full lint + token-ratchet + dual-Node suite on this ref, and a
  # secret scan (a TAG push does NOT trigger ci.yml, so the released tree would
  # otherwise never be scanned); `publish` `needs` it, so a red qualify blocks
  # the push. This is intentionally self-contained (not a cross-workflow
  # dependency) so the gate travels with the artifact.
  qualify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Token ratchet
        run: node scripts/css-token-lint.js --enforce
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

  # A pinned secret scan of the ref being published (mirrors ci.yml's job; runs
  # here too because tag pushes skip ci.yml). Publish blocks on this as well.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v5
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan working tree for secrets
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml --exit-code 1

  publish:
    needs: [qualify, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # v1.129 C6: a release image's identity is the TAG, but the app reports
      # package.json's version - if the ceremony ever tags without bumping (or
      # bumps without tagging), the published X.Y.Z image would self-report a
      # different version forever. Refuse the mismatch at the gate.
      - name: Assert tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} != package.json ${PKG} - refusing to publish a mismatched artifact"
            exit 1
          fi
          echo "tag ${{ github.ref_name }} == package.json ${PKG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: deantammam/filetube
          # flavor latest=auto (default): a semver tag also updates `latest`.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
