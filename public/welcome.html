<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Welcome to FileTube</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="/icons/apple-touch-icon-dark.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- F66 (UI pass sweep S1): the pre-paint guess by OS scheme (the 2021 header grounds);
       common.js syncThemeColorMeta collapses both to the app's own era + mode header. -->
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FileTube">
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    /* FOUC guard — identical to the other shells (see login.html). */
    (function () {
      var d = document.documentElement;
      try {
        var eras = ['2005', '2009', '2014', '2021'];
        var modes = ['light', 'dark'];
        var e = localStorage.getItem('ft-era');
        var m = localStorage.getItem('ft-mode');
        var legacy = localStorage.getItem('theme');
        var era = eras.indexOf(e) >= 0 ? e : '2021';
        var mode = modes.indexOf(m) >= 0 ? m
          : (e == null && m == null && (legacy === 'dark' || legacy === 'light')) ? legacy
          : 'light';
        d.setAttribute('data-theme', era);
        d.setAttribute('data-mode', mode);
        var iconSets = ['outlined', 'rounded', 'filled'];
        var iconAutoMap = { '2005': 'filled', '2009': 'filled', '2014': 'filled', '2021': 'rounded' };
        var storedIcons = localStorage.getItem('ft-icons');
        if (storedIcons === 'emoji') storedIcons = 'filled'; // the retired emoji set (UI pass D2.6)
        var iconSet = iconSets.indexOf(storedIcons) >= 0 ? storedIcons
          : storedIcons === 'auto' ? iconAutoMap[era]
          : 'outlined';
        d.setAttribute('data-icons', iconSet);
        if (localStorage.getItem('ft-custom-logo') === '1') d.classList.add('ft-custom-logo');

        /* v1.63.1 (slim gate W2): stars FOUC guard. A hidden-pref user must
           never see the static star markup flash before common.js runs --
           inline mirror of bootStarRatingsPref(); keep in sync. */
        if (localStorage.getItem('ft-star-ratings') === 'hidden') d.classList.add('ft-hide-stars');
      } catch (_) {
        d.setAttribute('data-theme', '2021');
        d.setAttribute('data-mode', 'light');
        d.setAttribute('data-icons', 'outlined');
      }
    })();
  </script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <span class="login-wordmark" aria-label="FileTube"><span class="login-wordmark-text">File<span class="tube">Tube</span></span><img class="login-logo-img" alt="" hidden></span>
        <p class="login-tagline">Welcome. Create the owner account. You'll be the admin, and everything already in this library becomes yours.</p>
      </div>

      <form class="login-form" id="welcome-form" autocomplete="on" novalidate>
        <div class="ui-field">
          <label class="ui-field__label" for="welcome-username">Username</label>
          <input type="text" id="welcome-username" class="ui-field__input" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="ui-field">
          <label class="ui-field__label" for="welcome-display">Display name (optional)</label>
          <input type="text" id="welcome-display" class="ui-field__input" name="displayName" autocomplete="name">
        </div>
        <div class="ui-field">
          <label class="ui-field__label" for="welcome-password">Password</label>
          <input type="password" id="welcome-password" class="ui-field__input" name="password" autocomplete="new-password" required>
        </div>
        <div class="ui-field">
          <label class="ui-field__label" for="welcome-confirm">Confirm password</label>
          <input type="password" id="welcome-confirm" class="ui-field__input" name="confirm" autocomplete="new-password" required>
        </div>
        <div class="login-error" id="welcome-error" role="alert" aria-live="polite"></div>
        <button type="submit" class="ui-btn ui-btn--primary ui-btn--lg" id="welcome-submit">Create admin &amp; sign in</button>
      </form>

      <div class="login-era-switch">
        <span class="login-era-label" id="login-era-label">Era</span>
        <div class="ui-segmented" role="radiogroup" aria-labelledby="login-era-label">
          <button type="button" class="ui-segmented__item" role="radio" aria-checked="false" data-era="2005" data-value="2005">'05</button>
          <button type="button" class="ui-segmented__item" role="radio" aria-checked="false" data-era="2009" data-value="2009">'09</button>
          <button type="button" class="ui-segmented__item" role="radio" aria-checked="false" data-era="2014" data-value="2014">'14</button>
          <button type="button" class="ui-segmented__item" role="radio" aria-checked="false" data-era="2021" data-value="2021">'21</button>
        </div>
      </div>
    </div>
    <p class="login-foot">This one-time setup runs only until an account exists. After this, sign in from any device.</p>
  </main>

  <script src="/js/glyph-pool.js"></script>

  <script src="/js/prefs-sync.js"></script>
  <!-- UI pass: the primitives' builders and the gesture helpers, before any page script -->
  <script src="/js/ui.js"></script>
  <script src="/js/interaction.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
