  <!-- F66 (UI pass sweep S1): the pre-paint guess by OS scheme (the 2021 header grounds);
       common.js syncThemeColorMeta collapses both to the app's own era + mode header. -->
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    /* FOUC guard -- set era+mode+icons on <html> BEFORE first paint (mirror of
       resolveTheme()/resolveIconSet() in /js/common.js; keep in sync). Same
       block every shell carries. */
    (function () {
      var d = document.documentElement;
      try {
        var eras = ['2005', '2009', '2014', '2021'];
        var modes = ['light', 'dark'];
        var e = localStorage.getItem('ft-era');
        var m = localStorage.getItem('ft-mode');
        var legacy = localStorage.getItem('theme');
        var era = eras.indexOf(e) >= 0 ? e : '2021';
        var mode = modes.indexOf(m) >= 0 ? m
          : (e == null && m == null && (legacy === 'dark' || legacy === 'light')) ? legacy
          : 'light';
        d.setAttribute('data-theme', era);
        d.setAttribute('data-mode', mode);
        var iconSets = ['outlined', 'rounded', 'filled'];
        var iconAutoMap = { '2005': 'filled', '2009': 'filled', '2014': 'filled', '2021': 'rounded' };
        var storedIcons = localStorage.getItem('ft-icons');
        if (storedIcons === 'emoji') storedIcons = 'filled'; // the retired emoji set (UI pass D2.6)
        var iconSet = iconSets.indexOf(storedIcons) >= 0 ? storedIcons
          : storedIcons === 'auto' ? iconAutoMap[era]
          : 'outlined';
        d.setAttribute('data-icons', iconSet);
        if (localStorage.getItem('ft-custom-logo') === '1') d.classList.add('ft-custom-logo');

        /* v1.63.1 (slim gate W2): stars FOUC guard. A hidden-pref user must
           never see the static star markup flash before common.js runs --
           inline mirror of bootStarRatingsPref(); keep in sync. */
        if (localStorage.getItem('ft-star-ratings') === 'hidden') d.classList.add('ft-hide-stars');
      } catch (_) {
        d.setAttribute('data-theme', '2021');
        d.setAttribute('data-mode', 'light');
        d.setAttribute('data-icons', 'outlined');
      }
    })();
  </script>
  <!-- UI pass step 2: the icon registry; the sprite is injected by the first script in the body. -->
  <script src="/js/icons.js"></script>
</head>
<body>
  <script>FTIcons.inject();</script>
  <header>
    <div class="header-left">
      <button type="button" class="ui-btn ui-btn--plain ui-btn--md ui-btn--icon menu-toggle" id="menu-toggle" aria-label="Open menu"><span class="ui-btn__icon"><svg class="ui-icon ui-icon--md" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg></span></button>

        <button type="button" id="search-btn" class="ui-btn ui-btn--plain ui-btn--md ui-btn--icon search-btn" aria-label="Search"><span class="ui-btn__icon"><svg class="ui-icon ui-icon--md" aria-hidden="true" focusable="false"><use href="#i-search"/></svg></span></button>

      <!-- v1.82: theme toggle moved into the account menu (injected here by common.js) -->

  <!-- ft-chrome-reserve:header (v1.339 L2) -->
  <script>
    /* Pre-paint header reserve (v1.339 L2, plan D5): holds the header-right slots BEFORE first
       paint from the per-device flags common.js remembers (CHROME_FLAG_KEYS + the bell's
       ft-notif-bell-enabled), so the search box and the glyph row never re-space when the async
       injectors land - each injector REPLACES its placeholder in place, or drops it when the
       feature is gone. Byte-identical in every header shell (test/unit/app-look-l2.test.js).
       Sweep S1: every placeholder is the real control's box - a plain ui-btn icon button
       (ui.css; common.js chromeButtonEl) with its sprite glyph, or the bell's shimmer disc, in
       the 22px icon slot; the account slot holds the 28px ui-avatar. */
    (function () {
      try {
        var d = document, ls = window.localStorage, hr = d.querySelector('header .header-right');
        if (!hr || hr.children.length) return;
        var NS = 'http://www.w3.org/2000/svg';
        var el = function (tag, cls, kind) {
          var e = d.createElement(tag);
          e.className = cls;
          if (kind) e.setAttribute('data-ft-reserve', kind);
          e.setAttribute('aria-hidden', 'true');
          if (tag === 'button') { e.type = 'button'; e.tabIndex = -1; }
          return e;
        };
        /* a ui-btn icon button's box, its icon slot holding `inner` */
        var ibtn = function (tag, cls, kind, inner) {
          var b = el(tag, 'ui-btn ui-btn--plain ui-btn--md ui-btn--icon ' + cls, kind);
          var s = d.createElement('span');
          s.className = 'ui-btn__icon';
          s.appendChild(inner);
          b.appendChild(s);
          return b;
        };
        /* a glyph from the icon sprite (UI pass step 2): <svg class="ui-icon"><use href="#i-NAME"/></svg> */
        var svg = function (name) {
          var g = d.createElementNS(NS, 'svg'), u = d.createElementNS(NS, 'use');
          g.setAttribute('class', 'ui-icon ui-icon--md');
          g.setAttribute('aria-hidden', 'true');
          g.setAttribute('focusable', 'false');
          u.setAttribute('href', '#i-' + name);
          g.appendChild(u);
          return g;
        };
        var b;
        if (ls.getItem('ft-queue-shown') === '1') hr.appendChild(ibtn('button', 'queue-btn', 'queue', svg('playlist_play')));
        if (ls.getItem('ft-notif-bell-enabled') === '1') {
          b = ibtn('span', 'notif-bell-btn', null, el('span', 'notif-bell-skel skeleton-shimmer'));
          b.id = 'notif-bell-placeholder';
          hr.appendChild(b);
        }
        if (d.getElementById('search-input')) hr.appendChild(ibtn('button', 'search-toggle-btn', 'search', svg('search')));
        if (ls.getItem('ft-ytdlp-module') === '1') hr.appendChild(ibtn('button', 'oneoff-download-btn', 'download', svg('download')));
        /* the account slot: an .account-menu wrapper like the real root, so it takes the row's
           slot even on mobile, where the trigger inside is display:none */
        b = el('span', 'account-menu');
        b.id = 'account-menu-placeholder';
        var t = el('span', 'ui-btn ui-btn--plain ui-btn--md ui-btn--icon account-menu-trigger');
        t.appendChild(el('span', 'ui-avatar ui-avatar--sm account-avatar skeleton-shimmer'));
        b.appendChild(t);
        hr.appendChild(b);
      } catch (_) { /* storage blocked: no reserve (the pre-L2 behaviour) */ }
    })();
  </script>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-section">
        <a href="/" class="sidebar-item">
          <svg class="chrome-icon" aria-hidden="true"><use href="#i-home"/></svg> Home
        </a>
        <a href="/setup.html" class="sidebar-item">
          <svg class="chrome-icon" aria-hidden="true"><use href="#i-settings"/></svg> Settings
        </a>
        <a href="/stats.html" class="sidebar-item" id="sidebar-stats-link">
          <svg class="chrome-icon" aria-hidden="true"><use href="#i-star"/></svg> Stats
        </a>
        <!-- Subscriptions + Books + Music sidebar links are injected by
             public/js/common.js's capability probes -- never hardcoded. -->
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Library</div>

      </div>

    <main class="main-content" id="main-content">
      <div id="view-root" data-view="music">
        <div class="music-toolbar">
          <h2>Music</h2>
          <!-- UI pass S7: every control is a ui-* primitive (sweep S7; plan D4). Tonal sm pills
               (32px) with registry icons; the two playback MODES are filter chips whose ON state is
               ink on --fill-selected (D8.8 - never red, and it shows in every era, 2009's gloss
               included); the sort is the native select in the ui-select field (16px, no iOS zoom). -->
          <div class="music-toolbar-actions">
            <span class="ui-select music-sort"><select id="music-sort-select" class="ui-select__native" aria-label="Sort music">
              <option value="newest">Recently added</option>
              <option value="title-asc">Title A-Z</option>
              <option value="title-desc">Title Z-A</option>
              <option value="artist-asc">Artist</option>
              <option value="album-asc">Album</option>
              <option value="duration-desc">Longest</option>
            </select><svg class="ui-icon ui-icon--md ui-select__chevron" aria-hidden="true" focusable="false"><use href="#i-expand_more"/></svg></span>
            <button class="ui-btn ui-btn--tonal ui-btn--sm ui-btn--pill ui-btn--icon music-slot-reserved" id="music-view-toggle" type="button" aria-hidden="true" tabindex="-1" inert title="Switch to list view" aria-label="Switch to list view"><span class="ui-btn__icon"><svg class="ui-icon ui-icon--md" aria-hidden="true" focusable="false"><use href="#i-view_list"/></svg></span></button>
            <!-- v1.317 (Dean, T1): the desktop THEATRE toggle (v1.222) is no longer a
                 toolbar button here - it is the player's own era-style #theater-btn in
                 the control bar (the same popcorn button the watch page uses), injected
                 by music.js through player.js's one writer and bound to the music
                 theatre layout (ft-music-theater). One control, one glyph writer. -->
            <!-- v1.234 (Dean): the "pop out" - float the player into a small window showing
                 the picked music skin (Document PiP where supported = always-on-top; a plain
                 independent window elsewhere). Invisible until a music track is playing AND the
                 pop-out is supported (music.js updatePopoutBtn); v1.339 L1b: it ships RESERVED
                 (slot kept, inert) so the first play never reflows the toolbar, and has no box
                 on a phone (style.css html.is-phone), where the in-tab skin is used instead. -->
            <button class="ui-btn ui-btn--tonal ui-btn--sm ui-btn--pill music-slot-reserved" id="music-popout-btn" type="button" aria-hidden="true" tabindex="-1" inert title="Pop the player out into a floating window" aria-label="Pop out player" aria-pressed="false"><span class="ui-btn__icon"><svg class="ui-icon ui-icon--sm" aria-hidden="true" focusable="false"><use href="#i-open_in_new"/></svg></span><span class="ui-btn__label">Pop out</span></button>
            <!-- v1.278 (Dean): desktop actions menu - the video-parity Extras
                 (Share/Transcript/Watch/Reheat/Like/Watched/queue/Move/Delete, "if
                 relevant") for the now-playing track, via the SHARED createExtrasMenu
                 factory (skin-surface.js). Hidden until a library-backed track is
                 expanded (music.js updateActionsBtn); the menu popover is styled by the
                 shell-agnostic .mms-sticker-menu rules (v1.278 CSS lift). -->
            <span class="music-actions-wrap">
              <button class="ui-btn ui-btn--tonal ui-btn--sm ui-btn--pill" id="music-actions-btn" type="button" hidden aria-haspopup="true" aria-expanded="false" title="More actions" aria-label="More actions for this track"><span class="ui-btn__icon"><svg class="ui-icon ui-icon--sm" aria-hidden="true" focusable="false"><use href="#i-more_horiz"/></svg></span><span class="ui-btn__label">More</span></button>
              <div class="mms-sticker-menu" id="music-actions-menu" role="menu" hidden></div>
            </span>
            <!-- v1.284 (Dean): the two playback-MODE toggles the mobile skin has (Loop,
                 Autoplay) surfaced on the desktop player - the shared ft-loop / autoplay
                 settings. UI pass S7: filter chips - aria-pressed is the state, ON is ink on
                 --fill-selected (never red, visible in every era). -->
            <button class="ui-chip ui-chip--filter music-mode-btn" id="music-loop-btn" type="button" title="Loop" aria-label="Loop" aria-pressed="false"><svg class="ui-icon ui-icon--sm" aria-hidden="true" focusable="false"><use href="#i-repeat"/></svg><span class="music-mode-lbl">Loop</span></button>
            <button class="ui-chip ui-chip--filter music-mode-btn" id="music-autoplay-btn" type="button" title="Autoplay" aria-label="Autoplay" aria-pressed="false"><svg class="ui-icon ui-icon--sm" aria-hidden="true" focusable="false"><use href="#i-playlist_play"/></svg><span class="music-mode-lbl">Autoplay</span></button>
            <button class="ui-btn ui-btn--tonal ui-btn--sm ui-btn--pill" id="music-shuffle-btn" type="button" title="Shuffle all"><span class="ui-btn__icon"><svg class="ui-icon ui-icon--sm" aria-hidden="true" focusable="false"><use href="#i-shuffle"/></svg></span><span class="ui-btn__label">Shuffle</span></button>
            <button class="ui-btn ui-btn--tonal ui-btn--sm ui-btn--pill" id="music-scan-btn" type="button" title="Scan music folders now"><span class="ui-btn__icon"><svg class="ui-icon ui-icon--sm" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg></span><span class="ui-btn__label">Scan</span></button>
          </div>
        </div>

        <!-- v1.44.2: tapping a song plays in the DOCKED mini-player (#player-dock,
             in the shell below), NOT a FULL in-view player — the album header +
             tracklist stay on screen (browse-while-playing). The playing row
             highlights instead (public/js/music.js).
             v1.73 (Dean ruling 2): the podcasts now-playing contract arrives -
             #player-slot hosts the EXPANDED big-art view, reached by tapping
             the dock (?nowplaying=1) or re-adopted when a FULL player rides a
             music->music swap; browse-while-playing is otherwise unchanged
             (the slot sits empty during normal docked playback). -->
        <!-- v1.222 (Dean): the "stage" wraps the expanded player + its now-playing
             panel so desktop THEATRE mode (.is-theater) can lay them side by side -
             player left, album / up-next right (the watch page's Related-files
             space) - instead of the panel stacked below. Mobile ignores the class
             (the panel stays below). -->
        <div id="music-stage" class="music-stage">
        <!-- v1.317 M4 (Dean: "Ambient mode in the music player in desktop"): the
             PLAYER stage - the watch page's .watch-player-stage shape around
             #player-slot, so the same ambient glow (a DIV pair painted from the
             album art sampled OFF-DOM, never the media element) sits behind the
             expanded player. Desktop only: below the mobile breakpoint the stage is
             a plain block (no stacking context over the full-screen skin) and the
             glow never lights. aria-hidden + pointer-events:none. -->
        <div id="music-player-stage" class="music-player-stage">
          <div id="music-ambient-glow" class="ambient-glow" aria-hidden="true" hidden>
            <div class="ambient-glow-layer"></div>
            <div class="ambient-glow-layer"></div>
          </div>
          <div id="player-slot"></div>
        </div>
        <!-- v1.104: the expanded now-playing panel - track metadata + "Up next"
             queue, shown ONLY while the player is expanded (state 'full') with a
             music track playing. The shared player host shows only big art in iOS
             background-audio mode, so this music-owned panel supplies the text +
             queue (public/js/music.js updateNowPlayingPanel). -->
        <div id="music-nowplaying-panel" class="music-nowplaying-panel" hidden></div>
        </div>
        <!-- Transient status (e.g. "Preparing track…" while an ALAC rendition
             transcodes on demand). -->
        <div id="music-status" class="music-status" role="status" hidden></div>

        <!-- Redesign S1: "Jump back in" - a horizontal strip of what you were last
             playing, above the tabs. Ships hidden around a static exact-shape skeleton;
             v1.339: the inline script below un-hides it before first paint when the
             last visit had items, public/js/music.js renderJumpBackIn re-reserves it at
             init (an SPA swap runs no inline script) and fills it from
             filter=recent-listening, or collapses it when there are none; tap a tile
             to resume. -->
        <section id="music-jumpback" class="music-jumpback" aria-label="Jump back in" hidden><h2 class="music-jump-head">Jump back in</h2><div class="music-jump-strip"><button type="button" class="ui-tile music-jump-tile music-jump-skel" tabindex="-1" disabled aria-hidden="true"><span class="music-jump-art skeleton-shimmer"></span><span class="music-jump-title">&nbsp;</span><span class="music-jump-sub">&nbsp;</span></button><button type="button" class="ui-tile music-jump-tile music-jump-skel" tabindex="-1" disabled aria-hidden="true"><span class="music-jump-art skeleton-shimmer"></span><span class="music-jump-title">&nbsp;</span><span class="music-jump-sub">&nbsp;</span></button><button type="button" class="ui-tile music-jump-tile music-jump-skel" tabindex="-1" disabled aria-hidden="true"><span class="music-jump-art skeleton-shimmer"></span><span class="music-jump-title">&nbsp;</span><span class="music-jump-sub">&nbsp;</span></button><button type="button" class="ui-tile music-jump-tile music-jump-skel" tabindex="-1" disabled aria-hidden="true"><span class="music-jump-art skeleton-shimmer"></span><span class="music-jump-title">&nbsp;</span><span class="music-jump-sub">&nbsp;</span></button><button type="button" class="ui-tile music-jump-tile music-jump-skel" tabindex="-1" disabled aria-hidden="true"><span class="music-jump-art skeleton-shimmer"></span><span class="music-jump-title">&nbsp;</span><span class="music-jump-sub">&nbsp;</span></button><button type="button" class="ui-tile music-jump-tile music-jump-skel" tabindex="-1" disabled aria-hidden="true"><span class="music-jump-art skeleton-shimmer"></span><span class="music-jump-title">&nbsp;</span><span class="music-jump-sub">&nbsp;</span></button></div></section>
        <script>
          /* v1.339 (L1, M1): PRE-PAINT reserve for "Jump back in". This runs during parse, before
             the tabs below exist, so a cold load paints the strip's exact-shape skeleton (the
             static markup above - music.js buildJumpBackSkeletonHtml(6), byte-locked by
             music-jumpback-reserve.test.js) instead of shoving the tabs down 181px when
             music.js fills it. Key = MUSIC_JUMPBACK_COUNT_KEY. An SPA swap never runs this
             (inserted scripts are inert); music.js reserves synchronously at init there. */
          (function () {
            try {
              if (parseInt(localStorage.getItem('ft-music-jumpback-count'), 10) > 0) document.getElementById('music-jumpback').hidden = false;
            } catch (_) { /* storage blocked: stays hidden (a one-time shift at most) */ }
          })();
        </script>

        <!-- UI pass S7: the four surfaces are ONE ui-segmented control (selected = the raised
             neutral segment, never a red underline - D8.8); music.js setActiveTab keeps
             aria-checked (and the .active hook) on the tab in effect. -->
        <div class="music-tabs ui-segmented" id="music-tabs" role="radiogroup" aria-label="Music">
          <button type="button" class="music-tab ui-segmented__item active" data-tab="home" role="radio" aria-checked="true">Home</button>
          <button type="button" class="music-tab ui-segmented__item" data-tab="albums" role="radio" aria-checked="false">Albums</button>
          <button type="button" class="music-tab ui-segmented__item" data-tab="artists" role="radio" aria-checked="false">Artists</button>
          <button type="button" class="music-tab ui-segmented__item" data-tab="songs" role="radio" aria-checked="false">Songs</button>
        </div>

        <!-- Drill-in breadcrumb (album/artist view); hidden on the top tabs. -->
        <div class="music-crumb" id="music-crumb" hidden></div>

        <!-- v1.44.2: "Playing from <Album>" context line — a sibling of
             #music-content (survives its re-renders) that reflects the currently
             playing music track and drills into its album on tap. -->
        <button type="button" class="ui-btn ui-btn--plain ui-btn--sm music-nowplaying" id="music-nowplaying" hidden></button>

        <!-- Album/artist grids OR a song list render into this host. -->
        <div id="music-content"></div>
        <!-- UI pass S7 (D9): the empty state is a ui-state block; music.js swaps its words for a
             search with no match, and a failed load renders an error state with Retry in
             #music-content instead (never this "No music yet"). -->
        <div class="music-empty ui-state" id="music-empty" hidden>
          <span class="ui-state__icon"><svg class="ui-icon ui-icon--lg" aria-hidden="true" focusable="false"><use href="#i-music_note"/></svg></span>
          <h3 class="ui-state__title" data-empty-title>No music yet</h3>
          <p class="ui-state__body" data-empty-body>Add a music folder in Settings, drop MP3, M4A, FLAC or WAV files in it, and scan.</p>
          <a class="ui-btn ui-btn--secondary ui-btn--md" href="/setup.html" data-empty-action>Open Settings</a>
        </div>
      </div>
    </main>
  </div>

    </a>
    <button type="button" class="ui-btn ui-btn--plain ui-btn--md ui-btn--stack bottom-nav-item" data-nav="theme" id="nav-theme-toggle">
      <span class="ui-btn__icon"><svg class="ui-icon ui-icon--lg" aria-hidden="true" focusable="false"><use href="#i-dark_mode"/></svg></span>
      <span class="ui-btn__label bottom-nav-label">Dark</span>
    </button>
    <a href="/setup.html" class="ui-btn ui-btn--plain ui-btn--md ui-btn--stack bottom-nav-item" data-nav="settings">
      <span class="ui-btn__icon"><svg class="ui-icon ui-icon--lg" aria-hidden="true" focusable="false"><use href="#i-settings"/></svg></span>
      <span class="ui-btn__label bottom-nav-label">Settings</span>
    </a>
  </nav>
  <!-- ft-chrome-reserve:nav (v1.339 L2) -->
  <script>
    /* Pre-paint bottom-bar reserve (v1.339 L2, plan D5): lays the bar out BEFORE first paint as
       it last resolved (ft-bottomnav-last, written by applyBottomNavCustomization): the static
       items it names shown and in order, the rest hidden, and a same-box placeholder for each
       async tab (Subs, Download, You) - so no tab re-spaces the bar when it lands; each
       injector REPLACES its placeholder in place. Byte-identical in every header shell
       (test/unit/app-look-l2.test.js). Sweep S1: a placeholder is the real tab's ui-btn stack
       (common.js bottomNavItemEl) - the fixed 24px icon slot over the label. */
    (function () {
      try {
        var d = document, nav = d.getElementById('bottom-nav');
        if (!nav) return;
        var last = JSON.parse(window.localStorage.getItem('ft-bottomnav-last') || 'null');
        if (!last || !last.length) return;
        var NS = 'http://www.w3.org/2000/svg';
        /* a glyph from the icon sprite (UI pass step 2): <svg class="ui-icon"><use href="#i-NAME"/></svg> */
        var svg = function (name) {
          var g = d.createElementNS(NS, 'svg'), u = d.createElementNS(NS, 'use');
          g.setAttribute('class', 'ui-icon ui-icon--lg');
          g.setAttribute('aria-hidden', 'true');
          g.setAttribute('focusable', 'false');
          u.setAttribute('href', '#i-' + name);
          g.appendChild(u);
          return g;
        };
        var reserve = function (id) {
          var e, inner, label;
          if (id === 'subscriptions') { e = d.createElement('a'); e.href = '/subscriptions'; inner = svg('subscriptions'); label = 'Subs'; }
          else if (id === 'oneoff-download') { e = d.createElement('span'); inner = svg('download'); label = 'Download'; }
          else if (id === 'you') { e = d.createElement('span'); inner = d.createElement('span'); inner.className = 'ui-avatar ui-avatar--xs account-avatar bottom-nav-you-avatar skeleton-shimmer'; label = 'You'; }
          else return null;
          e.className = 'ui-btn ui-btn--plain ui-btn--md ui-btn--stack bottom-nav-item';
          e.setAttribute('data-ft-reserve', id);
          e.setAttribute('aria-hidden', 'true');
          e.tabIndex = -1;
          var s = d.createElement('span');
          s.className = 'ui-btn__icon';
          s.appendChild(inner);
          e.appendChild(s);
          var l = d.createElement('span');
          l.className = 'ui-btn__label bottom-nav-label';
          l.textContent = label;
          e.appendChild(l);
          return e;
        };
        var byId = {}, items = nav.querySelectorAll('.bottom-nav-item[data-nav]'), i, id, e;
        for (i = 0; i < items.length; i++) byId[items[i].getAttribute('data-nav')] = items[i];
        var order = [], seen = {};
        for (i = 0; i < last.length && i < 16; i++) {
          id = String(last[i]);
          if (seen[id]) continue;
          e = byId[id] || reserve(id);
          if (e) { order.push(e); seen[id] = 1; }
        }
        if (!order.length) return;
        for (id in byId) if (!seen[id]) byId[id].hidden = true;
        for (i = 0; i < order.length; i++) { order[i].hidden = false; nav.appendChild(order[i]); }
      } catch (_) { /* storage blocked / bad JSON: the static bar (the pre-L2 behaviour) */ }
    })();
  </script>


  <!-- Persistent player dock + host template (FR-1, T1/T2). Both live
       OUTSIDE #view-root so in-app navigation never tears them down. The
       template is cloned ONCE, ever, by the persistent player controller
       (public/js/player.js) into a single live #player-host, reparented
       between the watch view's #player-slot (FULL) and #player-dock (DOCKED)
       here. #player-dock stays [hidden] (zero visible chrome, no layout
       shift) unless a video is actively loaded AND the user has navigated
       away from its watch page -- see player.js's dock()/expand()/close(). -->
  <div id="player-dock" hidden></div>
  <!-- v1.138: the desktop fullscreen STAGE - a never-moving shell-level
       container the host reparents INTO for native fullscreen, so
       navigation (which swaps #view-root and re-mounts the host) can never
       force-exit fullscreen. Empty + display:none except while fullscreen
       (style.css). -->
  <div id="fs-stage"></div>
  <template id="player-host-template">
    <div class="player-container" id="player-wrapper">
      <div id="audio-bg-art" class="audio-bg-art"></div>
      <div id="art-play-glyph" class="art-play-glyph" aria-hidden="true"></div>
      <div id="resume-toast" class="player-resumed" role="status" hidden>
        <span class="player-resumed__text">Resumed at <span id="resume-time-str">0:00</span></span>
        <button type="button" class="ui-btn ui-btn--plain ui-btn--sm player-resumed__action" id="resume-restart-btn"><span class="ui-btn__label">Start over</span></button>
      </div>
      <div id="transcode-overlay" class="resume-overlay" style="display: none;">
        <div class="transcode-spinner" id="transcode-spinner"></div>
        <h3 id="transcode-title">Preparing this video&hellip;</h3>
        <p id="transcode-message">FileTube is converting this file to a browser-friendly format. This only happens once &mdash; it'll start playing automatically when it's ready.</p>
      </div>
      <video id="media-player" preload="metadata" playsinline webkit-playsinline x5-playsinline style="display: none;">
        <track id="cc-track" kind="captions" srclang="en" label="English">
        Your browser does not support HTML5 video player.
      </video>
      <div id="speed-badge" class="speed-badge" hidden><svg class="ui-icon ui-icon--sm" aria-hidden="true"><use href="#i-fast_forward"/></svg><span class="speed-badge__label">2x</span></div>
      <div id="skip-controls" class="skip-controls" style="display: none;">
        <div class="skip-ripple skip-ripple-left" id="skip-ripple-left">« 15s</div>
        <div class="skip-ripple skip-ripple-right" id="skip-ripple-right">15s »</div>
      </div>
      <div id="audio-visualizer" class="audio-player-visual" style="display: none;">
        <div class="audio-vinyl" id="vinyl-disc"></div>
        <div class="audio-title" id="audio-visual-title">Audio track title</div>
        <div class="audio-subtitle" id="audio-visual-folder">Playlist folder</div>
      </div>
      <div id="player-controls" class="player-controls">
        <button type="button" id="track-prev-btn" class="pc-btn track-nav-btn" aria-label="Previous track" hidden>
          <span class="track-nav-ico" aria-hidden="true"></span>
        </button>
        <button type="button" id="pp-btn" class="pc-btn pp-btn" aria-label="Play" aria-pressed="false">
          <span class="pp-icon-play" aria-hidden="true"></span>
          <span class="pp-icon-pause" aria-hidden="true"></span>
        </button>
        <button type="button" id="track-next-btn" class="pc-btn track-nav-btn" aria-label="Next track" hidden>
          <span class="track-nav-ico" aria-hidden="true"></span>
        </button>
        <span id="time-cur" class="pc-time">0:00</span>
        <input type="range" id="seek-bar" class="pc-range pc-seek" min="0" max="1" step="0.001" value="0" aria-label="Seek">
        <span id="time-dur" class="pc-time">0:00</span>
        <button type="button" id="mute-btn" class="pc-btn mute-btn" aria-label="Mute" aria-pressed="false">
          <span class="mute-icon-on" aria-hidden="true"></span>
          <span class="mute-icon-off" aria-hidden="true"></span>
        </button>
        <input type="range" id="vol-bar" class="pc-range pc-vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <button type="button" id="settings-btn" class="pc-btn settings-btn" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
          <svg class="pc-svg-ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm112-260q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Z"/></svg>
        </button>
        <button type="button" id="fs-btn" class="pc-btn fs-btn" aria-label="Fullscreen">⛶</button>
        <!-- v1.112 (Dean): settings cog centralizes Speed + CC + PiP off the bar
             (YouTube's gear). The three controls are RELOCATED here as menu rows
             with their ids + wired handlers intact; cc-btn/pip-btn keep their own
             visibility gates, which now hide the ROW. -->
        <div id="settings-menu" class="chapters-menu settings-menu" hidden>
          <button type="button" id="speed-btn" class="pc-btn settings-menu-item speed-btn" aria-label="Playback speed">1×</button>
          <button type="button" id="cc-btn" class="pc-btn settings-menu-item cc-btn" aria-label="Toggle captions" aria-pressed="false" style="display: none;">CC</button>
          <button type="button" id="pip-btn" class="pc-btn settings-menu-item pip-btn" aria-label="Picture in picture">⧉</button>
        </div>
        <div id="chapters-menu" class="chapters-menu" hidden></div>
        <!-- v1.50.3: the playback-speed picker (chapters-menu popup pattern) -->
        <div id="speed-menu" class="chapters-menu speed-menu" hidden></div>
      </div>
    </div>
  </template>
