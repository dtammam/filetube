       SPA router swaps only #view-root, so page-local <head> styles were
       LOST on in-app navigation (the reader rendered unstyled when opened
       from the Books page). Shared stylesheet = styled on every path. -->
  <script>
    /* v1.41.17 (Dean): FOUC guard -- set era+mode+icons (and suppress the text
       logo when a custom one is configured) on <html> BEFORE first paint. This
       page was MISSING the guard the other shells carry, so a dark-mode / retro-
       era visitor flashed the default light/2021 theme on refresh. Mirror of
       resolveTheme()/resolveIconSet() in /js/common.js -- keep them in sync. */
    (function () {
      var d = document.documentElement;
      try {
        var eras = ['2005', '2009', '2014', '2021'];
        var modes = ['light', 'dark'];
        var e = localStorage.getItem('ft-era');
        var m = localStorage.getItem('ft-mode');
        var legacy = localStorage.getItem('theme');
        var era = eras.indexOf(e) >= 0 ? e : '2021';
        var mode = modes.indexOf(m) >= 0 ? m
          : (e == null && m == null && (legacy === 'dark' || legacy === 'light')) ? legacy
          : 'light';
        d.setAttribute('data-theme', era);
        d.setAttribute('data-mode', mode);
        var iconSets = ['outlined', 'rounded', 'filled'];
        var iconAutoMap = { '2005': 'filled', '2009': 'filled', '2014': 'filled', '2021': 'rounded' };
        var storedIcons = localStorage.getItem('ft-icons');
        if (storedIcons === 'emoji') storedIcons = 'filled'; // the retired emoji set (UI pass D2.6)
        var iconSet = iconSets.indexOf(storedIcons) >= 0 ? storedIcons
          : storedIcons === 'auto' ? iconAutoMap[era]
          : 'outlined';
        d.setAttribute('data-icons', iconSet);
        if (localStorage.getItem('ft-custom-logo') === '1') d.classList.add('ft-custom-logo');

        /* v1.63.1 (slim gate W2): stars FOUC guard. A hidden-pref user must
           never see the static star markup flash before common.js runs --
           inline mirror of bootStarRatingsPref(); keep in sync. */
        if (localStorage.getItem('ft-star-ratings') === 'hidden') d.classList.add('ft-hide-stars');
      } catch (_) {
        d.setAttribute('data-theme', '2021');
        d.setAttribute('data-mode', 'light');
        d.setAttribute('data-icons', 'outlined');
      }
    })();
  </script>
  <!-- UI pass step 2: the icon registry; the sprite is injected by the first script in the body. -->

  <!-- ft-chrome-reserve:header (v1.339 L2) -->
  <script>
    /* Pre-paint header reserve (v1.339 L2, plan D5): holds the header-right slots BEFORE first
       paint from the per-device flags common.js remembers (CHROME_FLAG_KEYS + the bell's
       ft-notif-bell-enabled), so the search box and the glyph row never re-space when the async
       injectors land - each injector REPLACES its placeholder in place, or drops it when the
       feature is gone. Byte-identical in every header shell (test/unit/app-look-l2.test.js).
       Sweep S1: every placeholder is the real control's box - a plain ui-btn icon button
       (ui.css; common.js chromeButtonEl) with its sprite glyph, or the bell's shimmer disc, in
       the 22px icon slot; the account slot holds the 28px ui-avatar. */
    (function () {
      try {
        var d = document, ls = window.localStorage, hr = d.querySelector('header .header-right');
        if (!hr || hr.children.length) return;
        var NS = 'http://www.w3.org/2000/svg';
        var el = function (tag, cls, kind) {
          var e = d.createElement(tag);
          e.className = cls;
          if (kind) e.setAttribute('data-ft-reserve', kind);
          e.setAttribute('aria-hidden', 'true');
          if (tag === 'button') { e.type = 'button'; e.tabIndex = -1; }
          return e;
        };
        /* a ui-btn icon button's box, its icon slot holding `inner` */
        var ibtn = function (tag, cls, kind, inner) {
          var b = el(tag, 'ui-btn ui-btn--plain ui-btn--md ui-btn--icon ' + cls, kind);
          var s = d.createElement('span');
          s.className = 'ui-btn__icon';
          s.appendChild(inner);
          b.appendChild(s);
          return b;
        };
        /* a glyph from the icon sprite (UI pass step 2): <svg class="ui-icon"><use href="#i-NAME"/></svg> */
        var svg = function (name) {
          var g = d.createElementNS(NS, 'svg'), u = d.createElementNS(NS, 'use');
          g.setAttribute('class', 'ui-icon ui-icon--md');
          g.setAttribute('aria-hidden', 'true');
          g.setAttribute('focusable', 'false');
          u.setAttribute('href', '#i-' + name);
          g.appendChild(u);
          return g;
        };
        var b;
        if (ls.getItem('ft-queue-shown') === '1') hr.appendChild(ibtn('button', 'queue-btn', 'queue', svg('playlist_play')));
        if (ls.getItem('ft-notif-bell-enabled') === '1') {
          b = ibtn('span', 'notif-bell-btn', null, el('span', 'notif-bell-skel skeleton-shimmer'));
          b.id = 'notif-bell-placeholder';
          hr.appendChild(b);
        }
        if (d.getElementById('search-input')) hr.appendChild(ibtn('button', 'search-toggle-btn', 'search', svg('search')));
        if (ls.getItem('ft-ytdlp-module') === '1') hr.appendChild(ibtn('button', 'oneoff-download-btn', 'download', svg('download')));
        /* the account slot: an .account-menu wrapper like the real root, so it takes the row's
           slot even on mobile, where the trigger inside is display:none */
        b = el('span', 'account-menu');
        b.id = 'account-menu-placeholder';
        var t = el('span', 'ui-btn ui-btn--plain ui-btn--md ui-btn--icon account-menu-trigger');
        t.appendChild(el('span', 'ui-avatar ui-avatar--sm account-avatar skeleton-shimmer'));
        b.appendChild(t);
        hr.appendChild(b);
      } catch (_) { /* storage blocked: no reserve (the pre-L2 behaviour) */ }
    })();
  </script>

  <!-- ft-chrome-reserve:nav (v1.339 L2) -->
  <script>
    /* Pre-paint bottom-bar reserve (v1.339 L2, plan D5): lays the bar out BEFORE first paint as
       it last resolved (ft-bottomnav-last, written by applyBottomNavCustomization): the static
       items it names shown and in order, the rest hidden, and a same-box placeholder for each
       async tab (Subs, Download, You) - so no tab re-spaces the bar when it lands; each
       injector REPLACES its placeholder in place. Byte-identical in every header shell
       (test/unit/app-look-l2.test.js). Sweep S1: a placeholder is the real tab's ui-btn stack
       (common.js bottomNavItemEl) - the fixed 24px icon slot over the label. */
    (function () {
      try {
        var d = document, nav = d.getElementById('bottom-nav');
        if (!nav) return;
        var last = JSON.parse(window.localStorage.getItem('ft-bottomnav-last') || 'null');
        if (!last || !last.length) return;
        var NS = 'http://www.w3.org/2000/svg';
        /* a glyph from the icon sprite (UI pass step 2): <svg class="ui-icon"><use href="#i-NAME"/></svg> */
        var svg = function (name) {
          var g = d.createElementNS(NS, 'svg'), u = d.createElementNS(NS, 'use');
          g.setAttribute('class', 'ui-icon ui-icon--lg');
          g.setAttribute('aria-hidden', 'true');
          g.setAttribute('focusable', 'false');
          u.setAttribute('href', '#i-' + name);
          g.appendChild(u);
          return g;
        };
        var reserve = function (id) {
          var e, inner, label;
          if (id === 'subscriptions') { e = d.createElement('a'); e.href = '/subscriptions'; inner = svg('subscriptions'); label = 'Subs'; }
          else if (id === 'oneoff-download') { e = d.createElement('span'); inner = svg('download'); label = 'Download'; }
          else if (id === 'you') { e = d.createElement('span'); inner = d.createElement('span'); inner.className = 'ui-avatar ui-avatar--xs account-avatar bottom-nav-you-avatar skeleton-shimmer'; label = 'You'; }
          else return null;
          e.className = 'ui-btn ui-btn--plain ui-btn--md ui-btn--stack bottom-nav-item';
          e.setAttribute('data-ft-reserve', id);
          e.setAttribute('aria-hidden', 'true');
          e.tabIndex = -1;
          var s = d.createElement('span');
          s.className = 'ui-btn__icon';
          s.appendChild(inner);
          e.appendChild(s);
          var l = d.createElement('span');
          l.className = 'ui-btn__label bottom-nav-label';
          l.textContent = label;
          e.appendChild(l);
          return e;
        };
        var byId = {}, items = nav.querySelectorAll('.bottom-nav-item[data-nav]'), i, id, e;
        for (i = 0; i < items.length; i++) byId[items[i].getAttribute('data-nav')] = items[i];
        var order = [], seen = {};
        for (i = 0; i < last.length && i < 16; i++) {
          id = String(last[i]);
          if (seen[id]) continue;
          e = byId[id] || reserve(id);
          if (e) { order.push(e); seen[id] = 1; }
        }
        if (!order.length) return;
        for (id in byId) if (!seen[id]) byId[id].hidden = true;
        for (i = 0; i < order.length; i++) { order[i].hidden = false; nav.appendChild(order[i]); }
      } catch (_) { /* storage blocked / bad JSON: the static bar (the pre-L2 behaviour) */ }
    })();
  </script>
